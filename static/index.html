<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>FULL Control v6</title>
<style>
:root{--bg:#f3f5f8;--surface:#fff;--surface2:#f8fafc;--line:#e5e7eb;--text:#111827;--muted:#667085;--accent:#f59e0b;--accent2:#fbbf24;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--shadow:0 8px 28px rgba(15,23,42,.06);--r:16px}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.desktop{display:flex;min-height:100vh}.side{width:245px;background:#111827;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}.brand{font-size:21px;font-weight:900;padding:4px 10px 28px}.brand span{color:var(--accent)}.side .nav button{display:block;width:100%;border:0;background:transparent;color:#cbd5e1;padding:13px 12px;text-align:left;border-radius:11px;margin:4px 0;font-weight:750}.side .nav button.active,.side .nav button:hover{background:#1f2937;color:#fff}.main{flex:1;min-width:0;padding:24px;max-width:1500px;margin:0 auto;width:100%}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}.title{font-size:28px;line-height:1.15;font-weight:900}.sub{color:var(--muted);margin-top:6px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.stat .n{font-size:27px;font-weight:900;margin-top:4px}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:11px 14px;border-radius:11px;font-weight:800;min-height:42px}.btn:hover{background:#f8fafc}.btn.primary{background:var(--accent);border-color:var(--accent);color:#111827}.btn.blue{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}.btn.green{background:#ecfdf3;border-color:#bbf7d0;color:#15803d}.btn.danger{color:var(--red)}.btn.block{width:100%}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:850}.aguardando{background:#eef2f7;color:#475467}.em_separacao{background:#fff4df;color:#9a6700}.pronto{background:#eaf8ef;color:#16713b}.enviado{background:#eeeaff;color:#5b3cc4}.available{background:#ecfdf3;color:#15803d}.busy{background:#fff7ed;color:#c2410c}.progress{height:9px;background:#e9edf2;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--accent);transition:.25s}.bar.ok{background:var(--green)}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:850;color:var(--muted)}.field input,.field select{width:100%;border:1px solid #cfd6df;background:#fff;color:var(--text);border-radius:11px;padding:12px;min-height:44px}.field input:focus,.field select:focus{outline:2px solid #fde68a;border-color:var(--accent)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.notice{background:#f8fafc;border:1px solid var(--line);padding:13px;border-radius:12px}.success{color:var(--green)}.err{color:var(--red)}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow:auto;margin-bottom:15px}.tab{border:0;background:transparent;padding:12px 14px;color:var(--muted);white-space:nowrap;font-weight:800}.tab.active{color:#9a6700;border-bottom:3px solid var(--accent)}.product{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin:10px 0}.product.claimed{border-color:#93c5fd;background:#f8fbff}.task-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 4px 18px rgba(15,23,42,.04)}.task-title{font-size:17px;font-weight:900;line-height:1.25}.qty-big{font-size:24px;font-weight:950}.qty-input{font-size:22px;font-weight:900;text-align:center;width:150px;min-height:54px;border:2px solid #cbd5e1;border-radius:13px;padding:8px}.qty-input:focus{border-color:var(--accent);outline:2px solid #fde68a}.metricline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:13px}.metric{background:var(--surface2);border:1px solid var(--line);padding:11px;border-radius:11px}.metric b{display:block;font-size:18px;margin-top:3px}.volume{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}.closed{background:#f6fff9;border-color:#9bd3b4}.volume-item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}.volume-item:last-child{border-bottom:0}.modalbg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.modal{background:#fff;border-radius:18px;width:min(100%,760px);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 30px 90px rgba(0,0,0,.25)}.home{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.homebox{width:min(760px,100%)}.home-title{font-size:36px;font-weight:950;text-align:center}.home-sub{text-align:center;color:var(--muted);margin:8px 0 25px}.portal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.portal{padding:28px;border-radius:20px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);text-align:left}.portal h2{margin:8px 0}.portal p{color:var(--muted);line-height:1.5}.portal .icon{font-size:34px}.mobilebar{display:none}.worker-header{background:#111827;color:#fff;margin:-24px -24px 18px;padding:18px 20px}.worker-header .brand{padding:0}.worker-wrap{max-width:760px;margin:0 auto}.shipment{padding:16px;border:1px solid var(--line);background:#fff;border-radius:16px;margin:10px 0;box-shadow:0 4px 18px rgba(15,23,42,.04)}.shipment:active{transform:scale(.995)}.claim-btn{width:100%;min-height:52px;font-size:16px}.sticky-bottom{position:sticky;bottom:0;background:rgba(243,245,248,.95);backdrop-filter:blur(8px);padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:8}.empty{text-align:center;padding:30px 12px;color:var(--muted)}
@media(max-width:900px){.side{display:none}.main{padding:16px 12px 90px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#111827;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20;gap:6px}.mobilebar button{flex:1;background:transparent;border:0;color:#cbd5e1;padding:8px 4px;font-size:11px;font-weight:800;border-radius:10px}.mobilebar button.active{background:#1f2937;color:#fff}.worker-header{margin:-16px -12px 16px;padding:15px 14px}.worker-wrap{width:100%}.top{gap:10px}.title{font-size:23px}.metricline{grid-template-columns:1fr 1fr}.portal-grid{grid-template-columns:1fr}.home-title{font-size:29px}.qty-input{width:130px}.task-actions{display:grid;grid-template-columns:1fr 1fr}.task-actions .full{grid-column:1/-1}.task-actions input{width:100%}}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.card{padding:14px}.metricline{grid-template-columns:1fr 1fr}.btn{padding:10px 11px}.task-actions{grid-template-columns:1fr}.task-actions .full{grid-column:auto}.qty-input{width:100%}}

.worker-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.worker-tabs button{border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 10px;font-weight:900;color:var(--muted)}.worker-tabs button.active{background:#111827;color:#fff;border-color:#111827}.worker-section-title{font-size:20px;font-weight:950;margin:8px 0 4px}.worker-section-sub{font-size:13px;color:var(--muted);margin-bottom:12px}.mobile-primary{width:100%;min-height:54px;font-size:16px}.qty-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.qty-panel .qty-input{width:100%;font-size:30px;min-height:64px}.box-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.box-summary .metric{padding:10px}.volume-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.danger-outline{border-color:#fecaca;color:#b91c1c;background:#fff}.product-state{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:900}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#16a34a}.dot.busy{background:#f59e0b}.worker-product-list .task-card{margin-bottom:10px}.worker-product-list .task-title{font-size:16px}.mobile-hide{display:block}@media(max-width:600px){.mobile-hide{display:none}.worker-tabs{position:sticky;top:0;background:var(--bg);padding:7px 0;z-index:7}.volume-actions{grid-template-columns:1fr}.task-title{font-size:16px}.qty-big{font-size:20px}.worker-header{box-shadow:0 2px 10px rgba(15,23,42,.08)}}
.box-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.worker-danger{border-color:#fecaca;color:#b91c1c;background:#fff}@media(max-width:600px){.box-choice{grid-template-columns:1fr}.worker-volume-actions{grid-template-columns:1fr}.worker-volume-actions .btn{width:100%}}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div>
<script>
const S={mode:new URLSearchParams(location.search).get('mode')||'home',view:'home',tab:'shipments',workerView:'products',fulls:[],full:null,workerFulls:[],users:[],performance:[],me:localStorage.getItem('full_me')||'',preview:null,hist:[]};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>new Intl.NumberFormat('pt-BR').format(Number(n||0)),dateBR=x=>x?x.split('-').reverse().join('/'):'—';
async function api(u,o={}){let h={...(o.headers||{})};if(!(o.body instanceof FormData))h['Content-Type']='application/json';let r=await fetch(u,{...o,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Erro');return d}
function badge(s){return `<span class="badge ${s}">${({aguardando:'Aguardando',em_separacao:'Em separação',pronto:'Pronto',enviado:'Enviado'})[s]||s}</span>`}
function goMode(m){location.href='/?mode='+m}
function shell(body){return `<div class="desktop"><aside class="side"><div class="brand">FULL <span>CONTROL</span></div><div class="nav"><button class="${S.view==='admin'?'active':''}" onclick="adminHome()">📊 Dashboard</button><button class="${S.view==='adminShip'?'active':''}" onclick="adminShipments()">📦 Envios</button><button class="${S.view==='adminUsers'?'active':''}" onclick="adminUsers()">👥 Colaboradores</button><button class="${S.view==='adminPerf'?'active':''}" onclick="adminPerf()">🏆 Desempenho</button><button onclick="goMode('worker')">📱 Área do colaborador</button></div><div style="position:absolute;bottom:20px;color:#94a3b8;font-size:11px">● tempo real</div></aside><main class="main">${body}</main></div><div class="mobilebar"><button class="${S.view==='admin'?'active':''}" onclick="adminHome()">📊<br>Dashboard</button><button class="${S.view==='adminShip'?'active':''}" onclick="adminShipments()">📦<br>Envios</button><button class="${S.view==='adminUsers'?'active':''}" onclick="adminUsers()">👥<br>Equipe</button><button class="${S.view==='adminPerf'?'active':''}" onclick="adminPerf()">🏆<br>Desempenho</button><button onclick="goMode('worker')">📱<br>Separar</button></div>`}
function render(){if(S.mode==='home'){home();return}if(S.mode==='worker'){workerRender();return}document.querySelector('#app').innerHTML=shell(S.view==='admin'?adminDashboard():S.view==='adminShip'?adminShipmentPage():S.view==='adminUsers'?adminUsersPage():S.view==='adminPerf'?adminPerformancePage():adminFullPage())}
function home(){document.querySelector('#app').innerHTML=`<div class="home"><div class="homebox"><div class="home-title">FULL Control</div><div class="home-sub">Separação e controle de envios do Mercado Livre</div><div class="portal-grid"><button class="portal" onclick="goMode('worker')"><div class="icon">📱</div><h2>Área do colaborador</h2><p>Selecione seu nome, veja os envios atribuídos e assuma os produtos que vai separar.</p><span class="btn primary block">Entrar para separar</span></button><button class="portal" onclick="goMode('admin')"><div class="icon">🖥️</div><h2>Área administrativa</h2><p>Cadastre envios, colaboradores, distribua os envios e acompanhe o desempenho.</p><span class="btn blue block">Entrar no administrativo</span></button></div></div></div>`}
function workerRender(){document.querySelector('#app').innerHTML=`<div class="worker-wrap"><div class="worker-header"><div class="row between"><div><div class="brand">FULL <span>CONTROL</span></div><div class="small" style="color:#cbd5e1">Área de separação</div></div><button class="btn" onclick="goMode('home')">Sair</button></div></div>${workerBody()}</div>`;if(S.me)loadWorkerShipments()}
function workerBody(){if(!S.me)return `<div class="card"><div class="title">Quem está separando?</div><div class="sub">Selecione seu nome para ver somente os envios atribuídos a você.</div><div class="field" style="margin-top:18px"><label>Colaborador</label><select id="meSel"><option value="">Selecione...</option>${S.users.map(u=>`<option value="${u.id}">${esc(u.nome)}</option>`).join('')}</select></div><button class="btn primary block" style="margin-top:12px" onclick="saveMe()">Continuar</button></div>`;let u=S.users.find(x=>x.id===S.me);return `<div class="top"><div><div class="title">Olá, ${esc(u?.nome||'colaborador')}</div><div class="sub">Escolha um envio para começar. Depois, assuma o produto que você vai separar.</div></div><button class="btn" onclick="logoutMe()">Trocar</button></div><div id="workerContent"><div class="empty">Carregando envios...</div></div>`}
async function loadWorkerShipments(){S.users=await api('/api/users');let all=await api('/api/fulls');let assigned=[];for(const x of all){let d=await api('/api/fulls/'+x.full.id);if((d.shipment_users||[]).some(u=>u.user_id===S.me))assigned.push(d)}S.workerFulls=assigned;const el=$('#workerContent');if(!el)return;if(!assigned.length){el.innerHTML='<div class="empty">Nenhum envio foi atribuído a você.</div>';return}el.innerHTML=assigned.map(d=>`<div class="shipment"><div class="row between"><div><b>${esc(d.full.nome)}</b><div class="small muted">Frete #${esc(d.full.frete_ml||'—')} • ${dateBR(d.full.previsao_data)} • ${badge(d.full.status)}</div></div><button class="btn primary" onclick="openWorkerFull('${d.full.id}')">Abrir envio</button></div><div class="metricline"><div class="metric"><span class="small muted">Produtos</span><b>${d.stats.produtos}</b></div><div class="metric"><span class="small muted">Unidades</span><b>${fmt(d.stats.unidades)}</b></div><div class="metric"><span class="small muted">Separadas</span><b>${fmt(d.stats.separado)}</b></div><div class="metric"><span class="small muted">Volumes</span><b>${d.stats.volumes}</b></div></div></div>`).join('')}
async function openWorkerFull(id){S.full=await api('/api/fulls/'+id);S.workerView='products';renderWorkerProducts()}
function workerHeader(d,backLabel='Envios',backFn='workerRender()'){return `<div class="worker-header"><div class="row between"><div><button class="btn" onclick="${backFn}">← ${backLabel}</button><div style="margin-top:10px;font-weight:950;font-size:19px">${esc(d.full.nome)}</div><div class="small" style="color:#cbd5e1">#${esc(d.full.frete_ml||'—')} • ${dateBR(d.full.previsao_data)} • ${badge(d.full.status)}</div></div><button class="btn" onclick="logoutMe()">Trocar</button></div></div>`}
function workerNav(){return `<div class="worker-tabs"><button class="${S.workerView==='products'?'active':''}" onclick="S.workerView='products';renderWorkerProducts()">📋 Produtos</button><button class="${S.workerView==='separating'?'active':''}" onclick="S.workerView='separating';renderWorkerProducts()">📦 Produtos em separação</button></div>`}
function renderWorkerProducts(){const d=S.full;if(!d)return;document.querySelector('#app').innerHTML=`<div class="worker-wrap">${workerHeader(d)}<div class="card" style="margin-bottom:12px"><div class="row between"><div><b>Progresso do envio</b><div class="small muted">${fmt(d.stats.separado)} de ${fmt(d.stats.unidades)} unidades</div></div><b>${d.stats.progresso.toFixed(0)}%</b></div><div class="progress" style="margin-top:10px"><div class="bar ${d.stats.progresso>=100?'ok':''}" style="width:${Math.min(100,d.stats.progresso)}%"></div></div></div>${workerNav()}${S.workerView==='separating'?workerSeparatingScreen(d):workerAvailableScreen(d)}</div>`}
function workerAvailableScreen(d){let available=d.products.filter(p=>!p.claimed_by);let mine=d.products.filter(p=>p.claimed_by===S.me);return `<div class="worker-section-title">Produtos do envio</div><div class="worker-section-sub">Toque em <b>Separar</b> para assumir um produto. Depois ele fica exclusivo para você.</div>${mine.length?`<div class="notice" style="margin-bottom:12px"><b>${mine.length} produto(s) em separação</b><div class="small muted" style="margin-top:4px">Abra a aba <b>Produtos em separação</b> para continuar.</div></div>`:''}<div class="worker-product-list">${available.length?available.map(p=>workerAvailableCard(p)).join(''):'<div class="empty">Nenhum produto disponível para assumir.</div>'}</div>`}
function workerAvailableCard(p){return `<div class="task-card"><div class="row between" style="align-items:flex-start"><div style="min-width:0"><div class="task-title">${esc(p.nome)}</div><div class="small muted" style="margin-top:4px">SKU ${esc(p.sku||p.codigo_ml||'-')}</div></div><span class="badge available">Disponível</span></div><div class="metricline"><div class="metric"><span class="small muted">Solicitado</span><b>${fmt(p.quantidade)}</b></div><div class="metric"><span class="small muted">Separado</span><b>${fmt(p.separado)}</b></div></div><button class="btn primary claim-btn" style="margin-top:13px" onclick="claimProduct('${p.id}')">▶ Separar este produto</button></div>`}
function workerSeparatingScreen(d){let mine=d.products.filter(p=>p.claimed_by===S.me);return `<div class="worker-section-title">Produtos em separação</div><div class="worker-section-sub">Estes produtos foram assumidos por você e estão indisponíveis para os demais colaboradores.</div>${mine.length?mine.map(p=>workerSeparatingCard(p,d)).join(''):'<div class="empty">Você ainda não assumiu nenhum produto neste envio.</div>'}<div class="card" style="margin-top:12px"><div class="row between"><div><b>Caixas / volumes</b><div class="small muted">Ao registrar unidades, escolha se vai abrir uma nova caixa ou colocar em uma caixa já existente.</div></div><button class="btn primary" onclick="newVol()">＋ Abrir nova caixa</button></div>${workerVolumeList(d)}</div>`}
function workerSeparatingCard(p,d){let pct=p.quantidade?Math.min(100,p.separado/p.quantidade*100):0;let boxed=p.em_volumes||0;let remaining=Math.max(0,p.separado-boxed);return `<div class="task-card claimed"><div class="row between" style="align-items:flex-start"><div style="min-width:0"><div class="product-state"><span class="dot"></span> Em separação</div><div class="task-title" style="margin-top:6px">${esc(p.nome)}</div><div class="small muted" style="margin-top:4px">SKU ${esc(p.sku||p.codigo_ml||'-')}</div></div><div style="text-align:right"><div class="qty-big">${fmt(p.separado)} / ${fmt(p.quantidade)}</div><div class="small muted">${pct.toFixed(0)}%</div></div></div><div class="progress" style="margin-top:12px"><div class="bar ${pct>=100?'ok':''}" style="width:${pct}%"></div></div><div class="qty-panel" style="margin-top:12px"><div class="field"><label>Total separado</label><input id="wsep-${p.id}" class="qty-input" type="number" inputmode="numeric" min="0" max="${p.quantidade}" value="${p.separado}"></div><button class="btn primary mobile-primary" style="margin-top:10px" onclick="saveWorkerProgress('${p.id}')">Salvar quantidade separada</button></div><div class="box-summary"><div class="metric"><span class="small muted">Em caixas</span><b>${fmt(boxed)}</b></div><div class="metric"><span class="small muted">Aguardando caixa</span><b>${fmt(remaining)}</b></div></div><button class="btn blue mobile-primary" style="margin-top:10px" onclick="openWorkerBox('${d.full.id}','${p.id}')">📦 Registrar em uma caixa</button><button class="btn danger-outline mobile-primary" style="margin-top:8px" onclick="releaseProduct('${p.id}')">↩ Remover da separação</button>${p.instrucoes?`<div class="notice" style="margin-top:12px"><b>⚠ Instruções</b><div class="small" style="margin-top:5px">${esc(p.instrucoes)}</div></div>`:''}</div>`}
function workerVolumeList(d){if(!d.volumes.length)return '<div class="empty">Nenhuma caixa aberta ainda.</div>';return d.volumes.map(v=>`<div class="volume" style="margin-top:10px"><div class="row between"><div><b>Caixa ${v.seq}</b><div class="small muted">${fmt(v.total_unidades)} unidades • ${v.tipo==='mista'?'Mista':v.tipo==='unica'?'Única':'Vazia'}</div></div><span class="badge ${v.status==='fechada'?'pronto':'em_separacao'}">${v.status==='fechada'?'Fechada':'Aberta'}</span></div>${v.items.map(i=>`<div class="volume-item"><span>${esc(i.product_nome)}</span><b>${fmt(i.quantidade)}</b></div>`).join('')||'<div class="small muted" style="margin-top:10px">Vazia</div>'}<div class="volume-actions">${v.status==='aberta'?`<button class="btn blue" onclick="editVol('${v.id}')">✏️ Editar</button>`:''}<button class="btn danger-outline" onclick="deleteVol('${v.id}')">🗑 Excluir</button>${v.status==='aberta'?`<button class="btn primary" onclick="toggleVol('${v.id}')">🔒 Fechar caixa</button>`:`<button class="btn" onclick="toggleVol('${v.id}')">↩ Reabrir</button>`}</div></div>`).join('')}
async function claimProduct(pid){try{await api('/api/products/'+pid+'/claim',{method:'POST',body:JSON.stringify({user_id:S.me})});S.full=await api('/api/fulls/'+S.full.full.id);S.workerView='separating';renderWorkerProducts()}catch(e){alert(e.message);S.full=await api('/api/fulls/'+S.full.full.id);renderWorkerProducts()}}
async function saveWorkerProgress(pid){let p=S.full.products.find(x=>x.id===pid),v=Number($('#wsep-'+pid).value||0),a=S.full.assignments.find(x=>x.product_id===pid&&x.user_id===S.me);if(!a)return alert('Assuma o produto primeiro.');if(v>p.quantidade)return alert('A quantidade não pode ultrapassar o solicitado.');try{await api('/api/assignments/'+a.id+'/progress',{method:'PUT',body:JSON.stringify({separado:v})});S.full=await api('/api/fulls/'+S.full.full.id);renderWorkerProducts()}catch(e){alert(e.message)}}
async function releaseProduct(pid){if(!confirm('Remover este produto da sua separação? A quantidade separada será zerada. Se houver unidades em caixas, remova-as primeiro.'))return;try{await api('/api/products/'+pid+'/claim?user_id='+encodeURIComponent(S.me),{method:'DELETE'});S.full=await api('/api/fulls/'+S.full.full.id);renderWorkerProducts()}catch(e){alert(e.message)}}
async function openWorkerBox(fullId,pid){let d=await api('/api/fulls/'+fullId),p=d.products.find(x=>x.id===pid);if(!p)return;let boxed=d.volumes.reduce((t,v)=>t+v.items.filter(i=>i.product_id===pid).reduce((s,i)=>s+i.quantidade,0),0),remaining=Math.max(0,p.separado-boxed);if(remaining<=0)return alert('Não há unidades separadas deste produto aguardando registro em caixas.');let open=d.volumes.filter(v=>v.status==='aberta');modal(`<h2>Onde vai este volume?</h2><div class="notice"><b>${esc(p.nome)}</b><div class="small muted" style="margin-top:4px">Separadas: ${fmt(p.separado)} • Em caixas: ${fmt(boxed)} • Restam: ${fmt(remaining)}</div></div><div class="grid2" style="margin-top:14px"><button class="btn primary" style="min-height:72px" onclick="chooseNewBox('${fullId}','${pid}',${remaining})">📦<br>Nova caixa</button>${open.length?`<button class="btn blue" style="min-height:72px" onclick="chooseExistingBox('${fullId}','${pid}',${remaining})">➕<br>Caixa existente</button>`:'<div class="notice">Não há caixas abertas. Escolha <b>Nova caixa</b>.</div>'}</div><button class="btn block" style="margin-top:12px" onclick="closeM()">Cancelar</button>`)}
async function chooseNewBox(fullId,pid,remaining){try{let r=await api('/api/fulls/'+fullId+'/volumes',{method:'POST',body:JSON.stringify({created_by:S.me||null})});closeM();openBoxQuantity(r.id,pid,remaining)}catch(e){alert(e.message)}}
async function chooseExistingBox(fullId,pid,remaining){let d=await api('/api/fulls/'+fullId),open=d.volumes.filter(v=>v.status==='aberta');modal(`<h2>Escolher caixa</h2><div class="small muted">A mesma caixa pode receber produtos diferentes.</div><div style="margin-top:12px">${open.map(v=>`<button class="btn block" style="text-align:left;margin-top:8px" onclick="closeM();openBoxQuantity('${v.id}','${pid}',${remaining})"><b>Caixa ${v.seq}</b> — ${fmt(v.total_unidades)} unidades${v.tipo==='mista'?' • Mista':''}</button>`).join('')}</div><button class="btn block" style="margin-top:12px" onclick="closeM()">Cancelar</button>`)}
function openBoxQuantity(vid,pid,remaining){let p=S.full.products.find(x=>x.id===pid);let v=S.full.volumes.find(x=>x.id===vid);modal(`<h2>Caixa ${v?.seq||''}</h2><div class="notice"><b>${esc(p?.nome||'Produto')}</b><div class="small muted" style="margin-top:4px">Até ${fmt(remaining)} unidades podem ser registradas agora.</div></div><div class="field" style="margin-top:14px"><label>Quantidade que entrou nesta caixa</label><input id="boxq" class="qty-input" style="width:100%" type="number" inputmode="numeric" min="1" max="${remaining}" value="${remaining}"></div><div class="small muted" style="margin-top:6px">Não existe capacidade fixa. Informe somente o que realmente entrou.</div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveWorkerBox('${vid}','${pid}')">Registrar na caixa</button></div>`)}
async function saveWorkerBox(vid,pid){try{let q=Number($('#boxq').value||0);if(q<1)return alert('Informe uma quantidade maior que zero.');await api('/api/volumes/'+vid+'/items',{method:'POST',body:JSON.stringify({product_id:pid,quantidade:q,modo:'somar'})});closeM();S.full=await api('/api/fulls/'+S.full.full.id);S.workerView='separating';renderWorkerProducts()}catch(e){alert(e.message)}}
function editVol(vid){let v=S.full.volumes.find(x=>x.id===vid);if(!v)return;modal(`<h2>Editar caixa ${v.seq}</h2><div class="small muted">Altere a quantidade de cada produto. A soma não pode ultrapassar o que já foi separado.</div><div style="margin-top:12px">${v.items.map(i=>`<div class="field" style="margin-bottom:12px"><label>${esc(i.product_nome)}</label><input id="edit-${i.id}" class="qty-input" style="width:100%" type="number" min="0" value="${i.quantidade}"></div>`).join('')||'<div class="empty">Caixa vazia.</div>'}</div><div class="row"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveEditedVol('${vid}')">Salvar alterações</button></div>`)}
async function saveEditedVol(vid){try{let v=S.full.volumes.find(x=>x.id===vid);for(const i of v.items){let q=Number($('#edit-'+i.id).value||0);await api('/api/volumes/'+vid+'/items',{method:'POST',body:JSON.stringify({product_id:i.product_id,quantidade:q,modo:'definir'})})}closeM();S.full=await api('/api/fulls/'+S.full.full.id);render()}catch(e){alert(e.message)}}
async function deleteVol(id){if(!confirm('Excluir esta caixa? Os itens voltarão a ficar disponíveis para serem colocados em outra caixa.'))return;try{await api('/api/volumes/'+id,{method:'DELETE'});S.full=await api('/api/fulls/'+S.full.full.id);render()}catch(e){alert(e.message)}}
function adminDashboard(){return `<div class="top"><div><div class="title">Dashboard administrativo</div><div class="sub">Visão geral da operação</div></div><button class="btn primary" onclick="openImport()">＋ Novo envio</button></div><div class="grid"><div class="card stat"><div class="muted">Envios</div><div class="n">${S.fulls.length}</div></div><div class="card stat"><div class="muted">Em separação</div><div class="n">${S.fulls.filter(x=>x.full.status==='em_separacao').length}</div></div><div class="card stat"><div class="muted">Prontos</div><div class="n">${S.fulls.filter(x=>x.full.status==='pronto').length}</div></div><div class="card stat"><div class="muted">Enviados</div><div class="n">${S.fulls.filter(x=>x.full.status==='enviado').length}</div></div></div><div class="grid2" style="margin-top:14px"><div class="card"><b>Próximos envios</b>${S.fulls.slice(0,6).map(x=>`<div class="shipment"><div class="row between"><div><b>${esc(x.full.nome)}</b><div class="small muted">${dateBR(x.full.previsao_data)} • ${fmt(x.stats.unidades)} un.</div></div>${badge(x.full.status)}</div></div>`).join('')||'<div class="empty">Nenhum envio.</div>'}</div><div class="card"><b>Desempenho rápido</b>${S.performance.slice(0,6).map(p=>`<div style="margin-top:13px"><div class="row between"><b>${esc(p.nome)}</b><span>${p.progresso.toFixed(0)}%</span></div><div class="progress" style="margin-top:6px"><div class="bar ${p.progresso>=100?'ok':''}" style="width:${Math.min(100,p.progresso)}%"></div></div><div class="small muted" style="margin-top:4px">${fmt(p.separado)} / ${fmt(p.atribuido)} unidades</div></div>`).join('')||'<div class="empty">Sem dados.</div>'}</div></div>`}
function adminShipmentPage(){return `<div class="top"><div><div class="title">Envios</div><div class="sub">Cadastre, distribua e acompanhe cada FULL.</div></div><button class="btn primary" onclick="openImport()">＋ Cadastrar envio</button></div>${S.fulls.map(x=>`<div class="shipment"><div class="row between"><div><b>${esc(x.full.nome)}</b><div class="small muted">Frete #${esc(x.full.frete_ml||'—')} • previsto ${dateBR(x.full.previsao_data)}</div></div>${badge(x.full.status)}</div><div class="metricline"><div class="metric"><span class="small muted">Produtos</span><b>${x.stats.produtos}</b></div><div class="metric"><span class="small muted">Unidades</span><b>${fmt(x.stats.unidades)}</b></div><div class="metric"><span class="small muted">Separadas</span><b>${fmt(x.stats.separado)}</b></div><div class="metric"><span class="small muted">Volumes</span><b>${x.stats.volumes}</b></div></div><div class="row" style="margin-top:12px"><button class="btn blue" onclick="adminOpenFull('${x.full.id}')">Abrir envio</button><button class="btn" onclick="manageShipmentUsers('${x.full.id}')">👥 Atribuir colaboradores</button><button class="btn danger-outline" onclick="deleteFull('${x.full.id}')">🗑 Excluir envio</button></div></div>`).join('')||'<div class="empty">Nenhum envio cadastrado.</div>'}`}
function adminUsersPage(){return `<div class="top"><div><div class="title">Colaboradores</div><div class="sub">Cadastre as pessoas que vão trabalhar na separação.</div></div><button class="btn primary" onclick="openUsers()">＋ Novo colaborador</button></div><div class="grid2">${S.users.map(u=>`<div class="card"><div class="row between"><b>${esc(u.nome)}</b><span class="badge available">Ativo</span></div><div class="row" style="margin-top:10px"><button class="btn danger-outline" onclick="deleteUser('${u.id}')">🗑 Excluir</button></div></div>`).join('')||'<div class="empty">Nenhum colaborador cadastrado.</div>'}</div>`}
function adminPerformancePage(){return `<div class="top"><div><div class="title">Desempenho individual</div><div class="sub">A separação e os volumes são recalculados em tempo real. Se uma separação ou caixa for removida, o desempenho volta a refletir o estado atual.</div></div></div><div class="card"><div style="overflow:auto"><table><thead><tr><th>Colaborador</th><th>Envios</th><th>Produtos</th><th>Atribuído</th><th>Separado</th><th>Em caixas</th><th>Operacional</th></tr></thead><tbody>${S.performance.map(p=>`<tr><td><b>${esc(p.nome)}</b></td><td>${p.envios}</td><td>${p.produtos}</td><td>${fmt(p.atribuido)}</td><td>${fmt(p.separado)}</td><td>${fmt(p.em_volumes)}</td><td style="min-width:180px"><div class="progress"><div class="bar ${p.progresso_operacional>=100?'ok':''}" style="width:${Math.min(100,p.progresso_operacional)}%"></div></div><span class="small muted">${p.progresso_operacional.toFixed(1)}% • separação ${p.progresso.toFixed(1)}% • caixas ${p.progresso_volumes.toFixed(1)}%</span></td></tr>`).join('')}</tbody></table></div></div>`}
function adminFullPage(){if(!S.full)return '<div class="empty">Selecione um envio.</div>';let d=S.full;return `<div class="top"><div><button class="btn" onclick="adminShipments()">← Envios</button><div class="title" style="margin-top:10px">${esc(d.full.nome)}</div><div class="sub">Frete #${esc(d.full.frete_ml||'—')} • ${dateBR(d.full.previsao_data)} • ${badge(d.full.status)}</div></div></div><div class="grid"><div class="card stat"><div class="muted">Produtos</div><div class="n">${d.stats.produtos}</div></div><div class="card stat"><div class="muted">Unidades</div><div class="n">${fmt(d.stats.unidades)}</div></div><div class="card stat"><div class="muted">Separadas</div><div class="n">${fmt(d.stats.separado)}</div></div><div class="card stat"><div class="muted">Volumes</div><div class="n">${d.stats.volumes}</div></div></div><div class="tabs" style="margin-top:15px"><button class="tab ${S.tab==='shipments'?'active':''}" onclick="S.tab='shipments';render()">Produtos</button><button class="tab ${S.tab==='people'?'active':''}" onclick="S.tab='people';render()">Colaboradores</button><button class="tab ${S.tab==='volumes'?'active':''}" onclick="S.tab='volumes';render()">Volumes</button></div>${S.tab==='shipments'?adminProducts(d):S.tab==='people'?adminShipmentPeople(d):adminVolumes(d)}`}
function adminProducts(d){return `<div class="card"><b>Produtos</b>${d.products.map(p=>`<div class="product"><div class="row between"><div><b>${esc(p.nome)}</b><div class="small muted">${esc(p.sku||p.codigo_ml||'-')}</div></div><div>${p.claimed_user_nome?`<span class="badge busy">${esc(p.claimed_user_nome)}</span>`:'<span class="badge available">Disponível</span>'}</div></div><div class="metricline"><div class="metric"><span class="small muted">PDF</span><b>${fmt(p.quantidade)}</b></div><div class="metric"><span class="small muted">Separado</span><b>${fmt(p.separado)}</b></div><div class="metric"><span class="small muted">Em caixas</span><b>${fmt(p.em_volumes)}</b></div><div class="metric"><span class="small muted">Saldo</span><b>${fmt(p.saldo_separar)}</b></div></div></div>`).join('')}</div>`}
function adminShipmentPeople(d){return `<div class="card"><div class="row between"><div><b>Colaboradores deste envio</b><div class="small muted">Atribua o envio às pessoas. Dentro do envio, cada produto é assumido por quem clicar em "Separar" primeiro.</div></div><button class="btn primary" onclick="manageShipmentUsers('${d.full.id}')">＋ Atribuir</button></div>${d.shipment_users.map(u=>`<div class="shipment"><div class="row between"><b>${esc(u.user_nome)}</b><button class="btn danger" onclick="removeShipmentUser('${d.full.id}','${u.user_id}')">Remover</button></div></div>`).join('')||'<div class="empty">Nenhum colaborador atribuído.</div>'}</div>`}
function adminVolumes(d){return `<div class="card"><div class="row between"><div><b>Volumes</b><div class="small muted">As caixas são criadas conforme a operação acontece.</div></div><button class="btn primary" onclick="newVol()">＋ Abrir caixa</button></div><div class="grid2" style="margin-top:14px">${d.volumes.map(v=>`<div class="volume ${v.status==='fechada'?'closed':''}"><div class="row between"><div><b>Caixa ${v.seq}</b><div class="small muted">${fmt(v.total_unidades)} unidades</div></div><span class="badge ${v.status==='fechada'?'pronto':'em_separacao'}">${v.status==='fechada'?'Fechada':'Aberta'}</span></div>${v.items.map(i=>`<div class="volume-item"><span>${esc(i.product_nome)}</span><b>${fmt(i.quantidade)}</b></div>`).join('')||'<div class="small muted" style="margin-top:10px">Vazia</div>'}<div class="volume-actions"><button class="btn blue" onclick="addItem('${v.id}')">Editar conteúdo</button><button class="btn" onclick="editVol('${v.id}')">Editar quantidades</button><button class="btn danger-outline" onclick="deleteVol('${v.id}')">Excluir caixa</button>${v.status==='aberta'?`<button class="btn primary" onclick="toggleVol('${v.id}')">Fechar caixa</button>`:`<button class="btn" onclick="toggleVol('${v.id}')">Reabrir</button>`}</div></div>`).join('')||'<div class="empty">Nenhum volume ainda.</div>'}</div></div>`}
function modal(x){$('#modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeM()"><div class="modal">${x}</div></div>`}function closeM(){$('#modal').innerHTML=''}
function openImport(){modal(`<h2>Novo envio</h2><div class="notice">Importe o PDF do Mercado Livre. O sistema vai conferir produtos e quantidades antes de criar o envio.</div><div class="field" style="margin-top:14px"><label>PDF</label><input id="pdf" type="file" accept="application/pdf"></div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="readPDF()">Ler PDF</button></div>`)}
async function readPDF(){let f=$('#pdf').files[0];if(!f)return alert('Selecione o PDF.');let fd=new FormData();fd.append('file',f);let d=await api('/api/import-pdf',{method:'POST',body:fd});S.preview={...d.parsed,filename:d.filename};let p=S.preview,total=p.products.reduce((a,x)=>a+x.quantidade,0);modal(`<h2>Conferência</h2><div class="grid"><div class="card"><div class="muted">Frete</div><b>#${esc(p.frete_ml)}</b></div><div class="card"><div class="muted">Produtos</div><b>${p.products.length} / ${p.expected_products}</b></div><div class="card"><div class="muted">Unidades</div><b>${fmt(total)} / ${fmt(p.expected_units)}</b></div><div class="card"><div class="muted">Resultado</div><b class="${total===p.expected_units?'success':'err'}">${total===p.expected_units?'OK':'Divergência'}</b></div></div><div style="max-height:42vh;overflow:auto;margin-top:12px"><table><tr><th>Produto</th><th>SKU</th><th>Qtd</th></tr>${p.products.map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.sku||'-')}</td><td>${fmt(x.quantidade)}</td></tr>`).join('')}</table></div><div class="grid2" style="margin-top:12px"><div class="field"><label>Nome do envio</label><input id="fn" value="FULL #${esc(p.frete_ml)}"></div><div class="field"><label>Data prevista</label><input id="fd" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" ${total===p.expected_units?'':'disabled'} onclick="createFull()">Criar envio</button></div>`)}
async function createFull(){let p=S.preview,d=await api('/api/fulls',{method:'POST',body:JSON.stringify({nome:$('#fn').value,previsao_data:$('#fd').value,frete_ml:p.frete_ml,source_filename:p.filename,products:p.products})});closeM();S.full=d;S.view='adminFull';S.tab='shipments';await loadAll();render()}
function openUsers(){modal(`<h2>Novo colaborador</h2><div class="field"><label>Nome</label><input id="un" placeholder="Nome do colaborador"></div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="addUser()">Cadastrar</button></div>`)}
async function addUser(){let nome=$('#un').value.trim();if(!nome)return;try{await api('/api/users',{method:'POST',body:JSON.stringify({nome})});closeM();await loadAll();render()}catch(e){alert(e.message)}}
function manageShipmentUsers(fid){let d=S.full?.full?.id===fid?S.full:null;loadFullTemp(fid).then(d=>{let assigned=new Set(d.shipment_users.map(x=>x.user_id));modal(`<h2>Colaboradores do envio</h2><div class="notice">Todos os colaboradores abaixo poderão abrir este envio. O primeiro a clicar em <b>Separar</b> assume o produto.</div><div style="margin-top:12px">${S.users.map(u=>`<div class="shipment"><div class="row between"><div><b>${esc(u.nome)}</b>${assigned.has(u.id)?'<div class="small success">Atribuído</div>':''}</div>${assigned.has(u.id)?`<button class="btn danger" onclick="removeShipmentUser('${fid}','${u.id}')">Remover</button>`:`<button class="btn primary" onclick="addShipmentUser('${fid}','${u.id}')">Atribuir</button>`}</div></div>`).join('')}</div><button class="btn" style="margin-top:8px" onclick="closeM()">Fechar</button>`)})}
async function loadFullTemp(fid){return await api('/api/fulls/'+fid)}
async function addShipmentUser(fid,uid){try{await api('/api/fulls/'+fid+'/collaborators',{method:'POST',body:JSON.stringify({user_id:uid})});closeM();await loadAll();if(S.full?.full.id===fid)S.full=await api('/api/fulls/'+fid);render()}catch(e){alert(e.message)}}
async function removeShipmentUser(fid,uid){if(!confirm('Remover este colaborador do envio?'))return;try{await api('/api/fulls/'+fid+'/collaborators/'+uid,{method:'DELETE'});closeM();await loadAll();if(S.full?.full.id===fid)S.full=await api('/api/fulls/'+fid);render()}catch(e){alert(e.message)}}
async function deleteFull(fid){if(!confirm('Excluir este envio? Todos os produtos, separações e caixas registrados nele serão apagados. Essa ação não pode ser desfeita.'))return;try{await api('/api/fulls/'+fid,{method:'DELETE'});await loadAll();render()}catch(e){alert(e.message)}}
async function deleteUser(uid){if(!confirm('Excluir este colaborador? Ele deixará de aparecer para novas atribuições, mas o histórico de separações já feitas por ele é mantido.'))return;try{await api('/api/users/'+uid,{method:'DELETE'});await loadAll();render()}catch(e){alert(e.message)}}
async function adminOpenFull(id){S.full=await api('/api/fulls/'+id);S.view='adminFull';S.tab='shipments';render()}
async function adminHome(){S.mode='admin';S.view='admin';await loadAll();render()}async function adminShipments(){S.mode='admin';S.view='adminShip';await loadAll();render()}async function adminUsers(){S.mode='admin';S.view='adminUsers';await loadAll();render()}async function adminPerf(){S.mode='admin';S.view='adminPerf';await loadAll();render()}
async function loadAll(){S.fulls=await api('/api/fulls');S.users=await api('/api/users');S.performance=await api('/api/performance')}
function logoutMe(){S.me='';localStorage.removeItem('full_me');S.full=null;workerRender()}
function saveMe(){let v=$('#meSel').value;if(!v)return alert('Selecione seu nome.');S.me=v;localStorage.setItem('full_me',v);workerRender()}
function newVol(){if(!S.full)return;api('/api/fulls/'+S.full.full.id+'/volumes',{method:'POST',body:JSON.stringify({created_by:S.me||null})}).then(async()=>{S.full=await api('/api/fulls/'+S.full.full.id);render()}).catch(e=>alert(e.message))}
function addItem(vid){let opts=S.full.products.map(p=>{let used=S.full.volumes.reduce((t,v)=>t+v.items.filter(i=>i.product_id===p.id).reduce((s,i)=>s+i.quantidade,0),0),rem=Math.max(0,p.separado-used);return `<option value="${p.id}" data-rem="${rem}">${esc(p.nome)} — ${fmt(rem)} disponíveis</option>`}).join('');modal(`<h2>Adicionar produto à caixa</h2><div class="field"><label>Produto</label><select id="vp">${opts}</select></div><div class="field" style="margin-top:12px"><label>Quantidade que entrou nesta caixa</label><input id="vq" class="qty-input" style="width:100%" type="number" min="1"></div><div class="small muted" style="margin-top:6px">A quantidade é definida conforme a caixa vai sendo montada. Não existe capacidade fixa.</div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveItem('${vid}')">Registrar</button></div>`)}
async function saveItem(vid){try{let q=Number($('#vq').value||0);if(q<1)return alert('Informe uma quantidade.');await api('/api/volumes/'+vid+'/items',{method:'POST',body:JSON.stringify({product_id:$('#vp').value,quantidade:q,modo:'definir'})});closeM();S.full=await api('/api/fulls/'+S.full.full.id);render()}catch(e){alert(e.message)}}
async function toggleVol(id){try{await api('/api/volumes/'+id+'/status',{method:'PUT'});S.full=await api('/api/fulls/'+S.full.full.id);render()}catch(e){alert(e.message)}}
async function loadHistory(){S.hist=await api('/api/fulls/'+S.full.full.id+'/history');S.tab='history';render()}
function ws(){let p=location.protocol==='https:'?'wss':'ws',w=new WebSocket(p+'://'+location.host+'/ws');w.onopen=()=>w.send('hello');w.onmessage=async e=>{let m=JSON.parse(e.data);if(m.type==='full_updated'){if(S.full?.full.id===m.full_id)S.full=m.data;if(S.mode==='admin')await loadAll();if(S.mode==='worker'&&S.full?.full.id===m.full_id)renderWorkerProducts();render()}if(m.type==='full_created'||m.type==='users_updated')await loadAll();if(m.type==='users_updated'&&S.mode==='worker')workerRender()};w.onclose=()=>setTimeout(ws,1500)}
(async()=>{try{S.users=await api('/api/users');if(S.mode==='admin'){S.view='admin';await loadAll();render()}else if(S.mode==='worker'){workerRender()}else{home()}ws()}catch(e){document.querySelector('#app').innerHTML='<div class="empty">Erro ao carregar sistema: '+esc(e.message)+'</div>'}})();
</script>
</body></html>
