<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181c">
<title>FULL Control v6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
--ink:#191a1e;--ink2:#2b2d33;--paper:#f4f2ec;--surface:#fff;--surface2:#faf8f3;
--line:#e4ded0;--line-strong:#d8d0bd;--muted:#726c5c;--text:#191a1e;
--safety:#ffc629;--safety-deep:#e6a800;--route:#2a5f95;--route-tint:#e8f0f9;
--go:#1f7a4d;--go-tint:#e7f5ed;--stop:#c73a2c;--stop-tint:#fbeae7;
--shadow:0 10px 28px rgba(25,22,14,.08);--shadow-lg:0 24px 60px rgba(20,18,12,.16);
--r:14px;--r-sm:10px;--r-lg:20px;
--f-display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
--f-body:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
--f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--text);font-family:var(--f-body)}
body{background-image:radial-gradient(circle at 1px 1px,rgba(25,22,14,.05) 1px,transparent 0);background-size:22px 22px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--safety-deep);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0}
.app{min-height:100vh}
.desktop{display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
.side{width:250px;background:var(--ink);color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side::before{content:'';display:block;height:6px;margin:-24px -16px 22px;background:repeating-linear-gradient(90deg,var(--safety) 0 3px,transparent 3px 6px,rgba(255,255,255,.15) 6px 8px,transparent 8px 12px)}
.brand{font-family:var(--f-display);font-size:20px;font-weight:700;padding:0 6px 26px;letter-spacing:.02em}
.brand span{color:var(--safety)}
.side .nav button{display:flex;align-items:center;gap:2px;width:100%;border:0;background:transparent;color:#b7b3a4;padding:13px 12px;text-align:left;border-radius:11px;margin:4px 0;font-weight:700;font-size:14.5px;transition:background .15s,color .15s}
.side .nav button.active{background:var(--safety);color:var(--ink)}
.side .nav button:hover:not(.active){background:var(--ink2);color:#fff}
.main{flex:1;min-width:0;padding:26px;max-width:1500px;margin:0 auto;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:20px}
.title{font-family:var(--f-display);font-size:27px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:6px;font-size:14px}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:19px;box-shadow:var(--shadow);position:relative}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stat .n{font-family:var(--f-display);font-size:28px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}

/* ---------- buttons ---------- */
.btn{border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:11px 15px;border-radius:11px;font-weight:700;min-height:42px;transition:transform .1s,box-shadow .15s}
.btn:hover{box-shadow:0 3px 0 var(--ink);transform:translateY(-2px)}
.btn:active{transform:translateY(0);box-shadow:none}
.btn.primary{background:var(--safety);border-color:var(--ink);color:var(--ink)}
.btn.primary:hover{box-shadow:0 3px 0 var(--safety-deep)}
.btn.blue{background:var(--route-tint);border-color:var(--route);color:var(--route)}
.btn.blue:hover{box-shadow:0 3px 0 var(--route)}
.btn.green{background:var(--go-tint);border-color:var(--go);color:var(--go)}
.btn.green:hover{box-shadow:0 3px 0 var(--go)}
.btn.danger{border-color:var(--stop);color:var(--stop)}
.btn.danger:hover{box-shadow:0 3px 0 var(--stop)}
.btn.danger-outline{border-color:var(--stop);color:var(--stop);background:var(--stop-tint)}
.btn.danger-outline:hover{box-shadow:0 3px 0 var(--stop)}
.btn.block{width:100%}

/* ---------- stamp badges ---------- */
.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:5px;font-size:10.5px;font-weight:700;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;border:1.5px solid currentColor;transform:rotate(-1.5deg);background:#fff}
.aguardando{color:var(--muted)}
.em_separacao{color:var(--safety-deep)}
.pronto{color:var(--go)}
.enviado{color:var(--route)}
.available{color:var(--go)}
.busy{color:var(--safety-deep)}

/* ---------- progress ---------- */
.progress{height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar{height:100%;background:var(--safety);transition:.25s}
.bar.ok{background:var(--go)}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select{width:100%;border:1.5px solid var(--line-strong);background:#fff;color:var(--text);border-radius:10px;padding:12px;min-height:44px}
.field input:focus,.field select:focus{outline:2.5px solid var(--safety-deep);outline-offset:1px;border-color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.mono{font-family:var(--f-mono)}
.notice{background:var(--surface2);border:1.5px dashed var(--line-strong);padding:13px;border-radius:12px}
.success{color:var(--go)}
.err{color:var(--stop)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);overflow:auto;margin-bottom:16px}
.tab{border:0;background:transparent;padding:12px 14px;color:var(--muted);white-space:nowrap;font-weight:700;font-size:13.5px}
.tab.active{color:var(--ink);border-bottom:3px solid var(--safety)}

/* ---------- products / tasks ---------- */
.product{background:#fff;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:16px;margin:10px 0}
.product.claimed{border-color:var(--route);background:var(--route-tint)}
.task-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:17px;margin-bottom:12px;box-shadow:var(--shadow)}
.task-title{font-family:var(--f-display);font-size:17px;font-weight:700;line-height:1.25}
.qty-big{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.qty-input{font-family:var(--f-display);font-size:22px;font-weight:700;text-align:center;width:150px;min-height:54px;border:2px solid var(--line-strong);border-radius:12px;padding:8px;font-variant-numeric:tabular-nums}
.qty-input:focus{border-color:var(--ink);outline:2.5px solid var(--safety-deep)}
.metricline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:14px}
.metric{background:var(--surface2);border:1px solid var(--line);padding:11px;border-radius:11px}
.metric b{display:block;font-family:var(--f-display);font-size:18px;margin-top:3px;font-variant-numeric:tabular-nums}

/* ---------- volumes (sealed-box tape signature) ---------- */
.volume{background:#fff;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:16px;position:relative;overflow:hidden}
.closed{background:var(--go-tint);border-color:var(--go)}
.closed::before{content:'';position:absolute;top:-14px;left:26px;width:64px;height:26px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.85) 0 4px,rgba(255,198,41,.85) 4px 8px);transform:rotate(-45deg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.volume-item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.volume-item:last-child{border-bottom:0}

/* ---------- modal ---------- */
.modalbg{position:fixed;inset:0;background:rgba(20,18,12,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:var(--r-lg);border-top:5px solid var(--safety);width:min(100%,760px);max-height:92vh;overflow:auto;padding:22px;box-shadow:var(--shadow-lg)}

/* ---------- home / portals ---------- */
.home{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.homebox{width:min(760px,100%)}
.home-title{font-family:var(--f-display);font-size:38px;font-weight:700;text-align:center;letter-spacing:-.01em}
.home-sub{text-align:center;color:var(--muted);margin:8px 0 26px}
.portal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.portal{padding:28px;border-radius:var(--r-lg);border:1.5px solid var(--line);background:#fff;box-shadow:var(--shadow);text-align:left;transition:transform .15s,box-shadow .15s}
.portal:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.portal h2{margin:14px 0 6px;font-size:19px}
.portal p{color:var(--muted);line-height:1.5;font-size:14px}
.portal .icon{font-size:26px;display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:13px;background:var(--surface2);border:1.5px solid var(--line)}
.mobilebar{display:none}

/* ---------- worker mode ---------- */
.worker-header{background:var(--ink);color:#fff;margin:-26px -26px 18px;padding:19px 22px;position:relative}
.worker-header::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(90deg,var(--safety) 0 3px,transparent 3px 6px,rgba(255,255,255,.15) 6px 8px,transparent 8px 12px)}
.worker-header .brand{padding:0}
.worker-wrap{max-width:760px;margin:0 auto}
.shipment{padding:16px;border:1.5px solid var(--line);background:#fff;border-radius:var(--r-sm);margin:10px 0;box-shadow:var(--shadow);transition:transform .1s}
.shipment:active{transform:scale(.985)}
.claim-btn{width:100%;min-height:52px;font-size:16px}
.sticky-bottom{position:sticky;bottom:0;background:rgba(244,242,236,.95);backdrop-filter:blur(8px);padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:8}
.empty{text-align:center;padding:34px 12px;color:var(--muted);font-size:14px}

@media(max-width:900px){
.side{display:none}
.main{padding:16px 12px 92px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid2{grid-template-columns:1fr}
.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--ink);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20;gap:6px;box-shadow:0 -6px 20px rgba(0,0,0,.2)}
.mobilebar button{flex:1;background:transparent;border:0;color:#b7b3a4;padding:8px 4px;font-size:11px;font-weight:700;border-radius:10px}
.mobilebar button.active{background:var(--ink2);color:var(--safety)}
.worker-header{margin:-16px -12px 16px;padding:16px 14px}
.worker-wrap{width:100%}
.top{gap:10px}
.title{font-size:22px}
.metricline{grid-template-columns:1fr 1fr}
.portal-grid{grid-template-columns:1fr}
.home-title{font-size:29px}
.qty-input{width:130px}
.task-actions{display:grid;grid-template-columns:1fr 1fr}
.task-actions .full{grid-column:1/-1}
.task-actions input{width:100%}
}
@media(max-width:480px){
.grid{grid-template-columns:1fr 1fr}
.card{padding:15px}
.metricline{grid-template-columns:1fr 1fr}
.btn{padding:10px 12px}
.task-actions{grid-template-columns:1fr}
.task-actions .full{grid-column:auto}
.qty-input{width:100%}
}

.worker-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.worker-tabs button{border:1.5px solid var(--line-strong);background:#fff;border-radius:12px;padding:13px 10px;font-weight:700;color:var(--muted);font-size:13.5px}
.worker-tabs button.active{background:var(--ink);color:var(--safety);border-color:var(--ink)}
.worker-section-title{font-family:var(--f-display);font-size:19px;font-weight:700;margin:10px 0 4px}
.worker-section-sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.mobile-primary{width:100%;min-height:54px;font-size:16px}
.qty-panel{background:var(--surface2);border:1.5px solid var(--line);border-radius:14px;padding:15px}
.qty-panel .qty-input{width:100%;font-size:30px;min-height:64px;background:#fff}
.box-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.box-summary .metric{padding:10px}
.volume-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.product-state{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--route)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--route)}
.dot.busy{background:var(--safety-deep)}
.worker-product-list .task-card{margin-bottom:10px}
.worker-product-list .task-title{font-size:16px}
.mobile-hide{display:block}
@media(max-width:600px){
.mobile-hide{display:none}
.worker-tabs{position:sticky;top:0;background:var(--paper);padding:8px 0;z-index:7}
.volume-actions{grid-template-columns:1fr}
.task-title{font-size:16px}
.qty-big{font-size:20px}
.worker-header{box-shadow:0 2px 12px rgba(0,0,0,.15)}
}
.box-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.worker-danger{border-color:var(--stop);color:var(--stop);background:var(--stop-tint)}
@media(max-width:600px){
.box-choice{grid-template-columns:1fr}
.worker-volume-actions{grid-template-columns:1fr}
.worker-volume-actions .btn{width:100%}
}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div>
<script>
const S={mode:new URLSearchParams(location.search).get('mode')||'home',view:'home',tab:'shipments',workerView:'products',fulls:[],full:null,workerFulls:[],users:[],performance:[],me:localStorage.getItem('full_me')||'',adminToken:localStorage.getItem('full_admin_token')||'',workerToken:localStorage.getItem('full_worker_token')||'',preview:null,hist:[]};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>new Intl.NumberFormat('pt-BR').format(Number(n||0)),dateBR=x=>x?x.split('-').reverse().join('/'):'—';
async function api(u,o={}){let h={...(o.headers||{})};if(!(o.body instanceof FormData))h['Content-Type']='application/json';if(S.adminToken)h['X-Admin-Token']=S.adminToken;if(S.workerToken)h['X-Worker-Token']=S.workerToken;let r=await fetch(u,{...o,headers:h}),d=await r.json().catch(()=>({}));if(r.status===401){if(S.adminToken){S.adminToken='';localStorage.removeItem('full_admin_token')}if(S.workerToken){S.workerToken='';localStorage.removeItem('full_worker_token');S.me='';localStorage.removeItem('full_me')}location.reload();throw Error(d.detail||'Sessão expirada. Faça login novamente.')}if(!r.ok)throw Error(d.detail||'Erro');return d}
function badge(s){return `<span class="badge ${s}">${({aguardando:'Aguardando',em_separacao:'Em separação',pronto:'Pronto',enviado:'Enviado'})[s]||s}</span>`}
function goMode(m){location.href='/?mode='+m}
function shell(body){return `<div class="desktop"><aside class="side"><div class="brand">FULL <span>CONTROL</span></div><div class="nav"><button class="${S.view==='admin'?'active':''}" onclick="adminHome()">📊 Dashboard</button><button class="${S.view==='adminShip'?'active':''}" onclick="adminShipments()">📦 Envios</button><button class="${S.view==='adminUsers'?'active':''}" onclick="adminUsers()">👥 Colaboradores</button><button class="${S.view==='adminPerf'?'active':''}" onclick="adminPerf()">🏆 Desempenho</button><button onclick="goMode('worker')">📱 Área do colaborador</button></div><div style="position:absolute;bottom:20px;color:#94a3b8;font-size:11px">● tempo real</div></aside><main class="main">${body}</main></div><div class="mobilebar"><button class="${S.view==='admin'?'active':''}" onclick="adminHome()">📊<br>Dashboard</button><button class="${S.view==='adminShip'?'active':''}" onclick="adminShipments()">📦<br>Envios</button><button class="${S.view==='adminUsers'?'active':''}" onclick="adminUsers()">👥<br>Equipe</button><button class="${S.view==='adminPerf'?'active':''}" onclick="adminPerf()">🏆<br>Desempenho</button><button onclick="goMode('worker')">📱<br>Separar</button></div>`}
function render(){if(S.mode==='home'){home();return}if(S.mode==='worker'){workerRender();return}document.querySelector('#app').innerHTML=shell(S.view==='admin'?adminDashboard():S.view==='adminShip'?adminShipmentPage():S.view==='adminUsers'?adminUsersPage():S.view==='adminPerf'?adminPerformancePage():adminFullPage())}
function adminLoginScreen(){document.querySelector('#app').innerHTML=`<div class="home"><div class="homebox"><div class="card" style="max-width:420px;margin:0 auto"><div class="title">Área administrativa</div><div class="sub">Digite a senha de administrador.</div><div class="field" style="margin-top:16px"><label>Senha</label><input id="adminPass" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter')doAdminLogin()"></div><div id="adminErr" class="small err" style="margin-top:6px"></div><button class="btn primary block" style="margin-top:14px" onclick="doAdminLogin()">Entrar</button><button class="btn block" style="margin-top:8px" onclick="goMode('home')">Voltar</button></div></div></div>`;$('#adminPass')?.focus()}
async function doAdminLogin(){let senha=$('#adminPass').value;if(!senha)return;try{let d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({senha})});S.adminToken=d.token||'';if(d.token)localStorage.setItem('full_admin_token',d.token);S.view='admin';await loadAll();render()}catch(e){$('#adminErr').textContent=e.message}}
async function adminGate(){try{let chk=await api('/api/admin/check');if(chk.protegido&&!chk.autenticado){adminLoginScreen();return}S.view='admin';await loadAll();render()}catch(e){adminLoginScreen()}}
function home(){document.querySelector('#app').innerHTML=`<div class="home"><div class="homebox"><div class="home-title">FULL Control</div><div class="home-sub">Separação e controle de envios do Mercado Livre</div><div class="portal-grid"><button class="portal" onclick="goMode('worker')"><div class="icon">📱</div><h2>Área do colaborador</h2><p>Selecione seu nome, veja os envios atribuídos e assuma os produtos que vai separar.</p><span class="btn primary block">Entrar para separar</span></button><button class="portal" onclick="goMode('admin')"><div class="icon">🖥️</div><h2>Área administrativa</h2><p>Cadastre envios, colaboradores, distribua os envios e acompanhe o desempenho.</p><span class="btn blue block">Entrar no administrativo</span></button></div></div></div>`}
function workerRender(){document.querySelector('#app').innerHTML=`<div class="worker-wrap"><div class="worker-header"><div class="row between"><div><div class="brand">FULL <span>CONTROL</span></div><div class="small" style="color:#cbd5e1">Área de separação</div></div><button class="btn" onclick="goMode('home')">Sair</button></div></div>${workerBody()}</div>`;if(S.me&&S.workerToken)loadWorkerShipments()}
function workerBody(){if(!S.me||!S.workerToken)return `<div class="card"><div class="title">Quem está separando?</div><div class="sub">Selecione seu nome e digite sua senha.</div><div class="field" style="margin-top:18px"><label>Colaborador</label><select id="meSel"><option value="">Selecione...</option>${S.users.map(u=>`<option value="${u.id}">${esc(u.nome)}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Senha</label><input id="mePass" type="password" placeholder="Sua senha" onkeydown="if(event.key==='Enter')saveMe()"></div><div id="meErr" class="small err" style="margin-top:6px"></div><button class="btn primary block" style="margin-top:12px" onclick="saveMe()">Continuar</button></div>`;let u=S.users.find(x=>x.id===S.me);return `<div class="top"><div><div class="title">Olá, ${esc(u?.nome||'colaborador')}</div><div class="sub">Escolha um envio para começar. Depois, assuma o produto que você vai separar.</div></div><button class="btn" onclick="logoutMe()">Trocar</button></div><div id="workerContent"><div class="empty">Carregando envios...</div></div>`}
async function loadWorkerShipments(){S.users=await api('/api/users');let all=await api('/api/fulls');let assigned=[];for(const x of all){let d=await api('/api/fulls/'+x.full.id);if((d.shipment_users||[]).some(u=>u.user_id===S.me))assigned.push(d)}S.workerFulls=assigned;const el=$('#workerContent');if(!el)return;if(!assigned.length){el.innerHTML='<div class="empty">Nenhum envio foi atribuído a você.</div>';return}el.innerHTML=assigned.map(d=>`<div class="shipment"><div class="row between"><div><b>${esc(d.full.nome)}</b><div class="small muted">Frete #${esc(d.full.frete_ml||'—')} • ${dateBR(d.full.previsao_data)} • ${badge(d.full.status)}</div></div><button class="btn primary" onclick="openWorkerFull('${d.full.id}')">Abrir envio</button></div><div class="metricline"><div class="metric"><span class="small muted">Produtos</span><b>${d.stats.produtos}</b></div><div class="metric"><span class="small muted">Unidades</span><b>${fmt(d.stats.unidades)}</b></div><div class="metric"><span class="small muted">Separadas</span><b>${fmt(d.stats.separado)}</b></div><div class="metric"><span class="small muted">Volumes</span><b>${d.stats.volumes}</b></div></div></div>`).join('')}
async function openWorkerFull(id){S.full=await api('/api/fulls/'+id);S.workerView='products';renderWorkerProducts()}
function workerHeader(d,backLabel='Envios',backFn='workerRender()'){return `<div class="worker-header"><div class="row between"><div><button class="btn" onclick="${backFn}">← ${backLabel}</button><div style="margin-top:10px;font-weight:950;font-size:19px">${esc(d.full.nome)}</div><div class="small" style="color:#cbd5e1">#${esc(d.full.frete_ml||'—')} • ${dateBR(d.full.previsao_data)} • ${badge(d.full.status)}</div></div><button class="btn" onclick="logoutMe()">Trocar</button></div></div>`}
function workerNav(){return `<div class="worker-tabs"><button class="${S.workerView==='products'?'active':''}" onclick="S.workerView='products';renderWorkerProducts()">📋 Produtos</button><button class="${S.workerView==='separating'?'active':''}" onclick="S.workerView='separating';renderWorkerProducts()">📦 Produtos em separação</button></div>`}
function renderWorkerProducts(){const d=S.full;if(!d)return;document.querySelector('#app').innerHTML=`<div class="worker-wrap">${workerHeader(d)}<div class="card" style="margin-bottom:12px"><div class="row between"><div><b>Progresso do envio</b><div class="small muted">${fmt(d.stats.separado)} de ${fmt(d.stats.unidades)} unidades</div></div><b>${d.stats.progresso.toFixed(0)}%</b></div><div class="progress" style="margin-top:10px"><div class="bar ${d.stats.progresso>=100?'ok':''}" style="width:${Math.min(100,d.stats.progresso)}%"></div></div></div>${workerNav()}${S.workerView==='separating'?workerSeparatingScreen(d):workerAvailableScreen(d)}</div>`}
function workerAvailableScreen(d){let available=d.products.filter(p=>!p.claimed_by);let mine=d.products.filter(p=>p.claimed_by===S.me);return `<div class="worker-section-title">Produtos do envio</div><div class="worker-section-sub">Toque em <b>Separar</b> para assumir um produto. Depois ele fica exclusivo para você.</div>${mine.length?`<div class="notice" style="margin-bottom:12px"><b>${mine.length} produto(s) em separação</b><div class="small muted" style="margin-top:4px">Abra a aba <b>Produtos em separação</b> para continuar.</div></div>`:''}<div class="worker-product-list">${available.length?available.map(p=>workerAvailableCard(p)).join(''):'<div class="empty">Nenhum produto disponível para assumir.</div>'}</div>`}
function workerAvailableCard(p){return `<div class="task-card"><div class="row between" style="align-items:flex-start"><div style="min-width:0"><div class="task-title">${esc(p.nome)}</div><div class="small muted" style="margin-top:4px">SKU ${esc(p.sku||p.codigo_ml||'-')}</div></div><span class="badge available">Disponível</span></div><div class="metricline"><div class="metric"><span class="small muted">Solicitado</span><b>${fmt(p.quantidade)}</b></div><div class="metric"><span class="small muted">Separado</span><b>${fmt(p.separado)}</b></div></div><button class="btn primary claim-btn" style="margin-top:13px" onclick="claimProduct('${p.id}')">▶ Separar este produto</button></div>`}
function workerSeparatingScreen(d){let mine=d.products.filter(p=>p.claimed_by===S.me);return `<div class="worker-section-title">Produtos em separação</div><div class="worker-section-sub">Estes produtos foram assumidos por você e estão indisponíveis para os demais colaboradores.</div>${mine.length?mine.map(p=>workerSeparatingCard(p,d)).join(''):'<div class="empty">Você ainda não assumiu nenhum produto neste envio.</div>'}<div class="card" style="margin-top:12px"><div class="row between"><div><b>Caixas / volumes</b><div class="small muted">Ao registrar unidades, escolha se vai abrir uma nova caixa ou colocar em uma caixa já existente.</div></div><button class="btn primary" onclick="newVol()">＋ Abrir nova caixa</button></div>${workerVolumeList(d)}</div>`}
function workerSeparatingCard(p,d){let pct=p.quantidade?Math.min(100,p.separado/p.quantidade*100):0;let boxed=p.em_volumes||0;let remaining=Math.max(0,p.separado-boxed);return `<div class="task-card claimed"><div class="row between" style="align-items:flex-start"><div style="min-width:0"><div class="product-state"><span class="dot"></span> Em separação</div><div class="task-title" style="margin-top:6px">${esc(p.nome)}</div><div class="small muted" style="margin-top:4px">SKU ${esc(p.sku||p.codigo_ml||'-')}</div></div><div style="text-align:right"><div class="qty-big">${fmt(p.separado)} / ${fmt(p.quantidade)}</div><div class="small muted">${pct.toFixed(0)}%</div></div></div><div class="progress" style="margin-top:12px"><div class="bar ${pct>=100?'ok':''}" style="width:${pct}%"></div></div><div class="qty-panel" style="margin-top:12px"><div class="field"><label>Total separado</label><input id="wsep-${p.id}" class="qty-input" type="number" inputmode="numeric" min="0" max="${p.quantidade}" value="${p.separado}"></div><button class="btn primary mobile-primary" style="margin-top:10px" onclick="saveWorkerProgress('${p.id}')">Salvar quantidade separada</button></div><div class="box-summary"><div class="metric"><span class="small muted">Em caixas</span><b>${fmt(boxed)}</b></div><div class="metric"><span class="small muted">Aguardando caixa</span><b>${fmt(remaining)}</b></div></div><button class="btn blue mobile-primary" style="margin-top:10px" onclick="openWorkerBox('${d.full.id}','${p.id}')">📦 Registrar em uma caixa</button><button class="btn danger-outline mobile-primary" style="margin-top:8px" onclick="releaseProduct('${p.id}')">↩ Remover da separação</button>${p.instrucoes?`<div class="notice" style="margin-top:12px"><b>⚠ Instruções</b><div class="small" style="margin-top:5px">${esc(p.instrucoes)}</div></div>`:''}</div>`}
function workerVolumeList(d){if(!d.volumes.length)return '<div class="empty">Nenhuma caixa aberta ainda.</div>';return d.volumes.map(v=>`<div class="volume" style="margin-top:10px"><div class="row between"><div><b>Caixa ${v.seq}</b><div class="small muted">${fmt(v.total_unidades)} unidades • ${v.tipo==='mista'?'Mista':v.tipo==='unica'?'Única':'Vazia'}</div></div><span class="badge ${v.status==='fechada'?'pronto':'em_separacao'}">${v.status==='fechada'?'Fechada':'Aberta'}</span></div>${v.items.map(i=>`<div class="volume-item"><span>${esc(i.product_nome)}</span><b>${fmt(i.quantidade)}</b></div>`).join('')||'<div class="small muted" style="margin-top:10px">Vazia</div>'}<div class="volume-actions">${v.status==='aberta'?`<button class="btn blue" onclick="editVol('${v.id}')">✏️ Editar</button>`:''}<button class="btn danger-outline" onclick="deleteVol('${v.id}')">🗑 Excluir</button>${v.status==='aberta'?`<button class="btn primary" onclick="toggleVol('${v.id}')">🔒 Fechar caixa</button>`:`<button class="btn" onclick="toggleVol('${v.id}')">↩ Reabrir</button>`}</div></div>`).join('')}
async function claimProduct(pid){try{await api('/api/products/'+pid+'/claim',{method:'POST',body:JSON.stringify({user_id:S.me})});S.full=await api('/api/fulls/'+S.full.full.id);S.workerView='separating';renderWorkerProducts()}catch(e){alert(e.message);S.full=await api('/api/fulls/'+S.full.full.id);renderWorkerProducts()}}
async function saveWorkerProgress(pid){let p=S.full.products.find(x=>x.id===pid),v=Number($('#wsep-'+pid).value||0),a=S.full.assignments.find(x=>x.product_id===pid&&x.user_id===S.me);if(!a)return alert('Assuma o produto primeiro.');if(v>p.quantidade)return alert('A quantidade não pode ultrapassar o solicitado.');try{await api('/api/assignments/'+a.id+'/progress',{method:'PUT',body:JSON.stringify({separado:v})});S.full=await api('/api/fulls/'+S.full.full.id);renderWorkerProducts()}catch(e){alert(e.message)}}
async function releaseProduct(pid){if(!confirm('Remover este produto da sua separação? A quantidade separada será zerada. Se houver unidades em caixas, remova-as primeiro.'))return;try{await api('/api/products/'+pid+'/claim?user_id='+encodeURIComponent(S.me),{method:'DELETE'});S.full=await api('/api/fulls/'+S.full.full.id);renderWorkerProducts()}catch(e){alert(e.message)}}
async function openWorkerBox(fullId,pid){let d=await api('/api/fulls/'+fullId),p=d.products.find(x=>x.id===pid);if(!p)return;let boxed=d.volumes.reduce((t,v)=>t+v.items.filter(i=>i.product_id===pid).reduce((s,i)=>s+i.quantidade,0),0),remaining=Math.max(0,p.separado-boxed);if(remaining<=0)return alert('Não há unidades separadas deste produto aguardando registro em caixas.');let open=d.volumes.filter(v=>v.status==='aberta');modal(`<h2>Onde vai este volume?</h2><div class="notice"><b>${esc(p.nome)}</b><div class="small muted" style="margin-top:4px">Separadas: ${fmt(p.separado)} • Em caixas: ${fmt(boxed)} • Restam: ${fmt(remaining)}</div></div><div class="grid2" style="margin-top:14px"><button class="btn primary" style="min-height:72px" onclick="chooseNewBox('${fullId}','${pid}',${remaining})">📦<br>Nova caixa</button>${open.length?`<button class="btn blue" style="min-height:72px" onclick="chooseExistingBox('${fullId}','${pid}',${remaining})">➕<br>Caixa existente</button>`:'<div class="notice">Não há caixas abertas. Escolha <b>Nova caixa</b>.</div>'}</div><button class="btn block" style="margin-top:12px" onclick="closeM()">Cancelar</button>`)}
async function chooseNewBox(fullId,pid,remaining){try{let r=await api('/api/fulls/'+fullId+'/volumes',{method:'POST',body:JSON.stringify({created_by:S.me||null})});closeM();openBoxQuantity(r.id,pid,remaining)}catch(e){alert(e.message)}}
async function chooseExistingBox(fullId,pid,remaining){let d=await api('/api/fulls/'+fullId),open=d.volumes.filter(v=>v.status==='aberta');modal(`<h2>Escolher caixa</h2><div class="small muted">A mesma caixa pode receber produtos diferentes.</div><div style="margin-top:12px">${open.map(v=>`<button class="btn block" style="text-align:left;margin-top:8px" onclick="closeM();openBoxQuantity('${v.id}','${pid}',${remaining})"><b>Caixa ${v.seq}</b> — ${fmt(v.total_unidades)} unidades${v.tipo==='mista'?' • Mista':''}</button>`).join('')}</div><button class="btn block" style="margin-top:12px" onclick="closeM()">Cancelar</button>`)}
function openBoxQuantity(vid,pid,remaining){let p=S.full.products.find(x=>x.id===pid);let v=S.full.volumes.find(x=>x.id===vid);modal(`<h2>Caixa ${v?.seq||''}</h2><div class="notice"><b>${esc(p?.nome||'Produto')}</b><div class="small muted" style="margin-top:4px">Até ${fmt(remaining)} unidades podem ser registradas agora.</div></div><div class="field" style="margin-top:14px"><label>Quantidade que entrou nesta caixa</label><input id="boxq" class="qty-input" style="width:100%" type="number" inputmode="numeric" min="1" max="${remaining}" value="${remaining}"></div><div class="small muted" style="margin-top:6px">Não existe capacidade fixa. Informe somente o que realmente entrou.</div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveWorkerBox('${vid}','${pid}')">Registrar na caixa</button></div>`)}
async function saveWorkerBox(vid,pid){try{let q=Number($('#boxq').value||0);if(q<1)return alert('Informe uma quantidade maior que zero.');await api('/api/volumes/'+vid+'/items',{method:'POST',body:JSON.stringify({product_id:pid,quantidade:q,modo:'somar'})});closeM();S.full=await api('/api/fulls/'+S.full.full.id);S.workerView='separating';renderWorkerProducts()}catch(e){alert(e.message)}}
function editVol(vid){let v=S.full.volumes.find(x=>x.id===vid);if(!v)return;modal(`<h2>Editar caixa ${v.seq}</h2><div class="small muted">Altere a quantidade de cada produto. A soma não pode ultrapassar o que já foi separado.</div><div style="margin-top:12px">${v.items.map(i=>`<div class="field" style="margin-bottom:12px"><label>${esc(i.product_nome)}</label><input id="edit-${i.id}" class="qty-input" style="width:100%" type="number" min="0" value="${i.quantidade}"></div>`).join('')||'<div class="empty">Caixa vazia.</div>'}</div><div class="row"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveEditedVol('${vid}')">Salvar alterações</button></div>`)}
async function saveEditedVol(vid){try{let v=S.full.volumes.find(x=>x.id===vid);for(const i of v.items){let q=Number($('#edit-'+i.id).value||0);await api('/api/volumes/'+vid+'/items',{method:'POST',body:JSON.stringify({product_id:i.product_id,quantidade:q,modo:'definir'})})}closeM();S.full=await api('/api/fulls/'+S.full.full.id);render()}catch(e){alert(e.message)}}
async function deleteVol(id){if(!confirm('Excluir esta caixa? Os itens voltarão a ficar disponíveis para serem colocados em outra caixa.'))return;try{await api('/api/volumes/'+id,{method:'DELETE'});S.full=await api('/api/fulls/'+S.full.full.id);render()}catch(e){alert(e.message)}}
function adminDashboard(){return `<div class="top"><div><div class="title">Dashboard administrativo</div><div class="sub">Visão geral da operação</div></div><button class="btn primary" onclick="openImport()">＋ Novo envio</button></div><div class="grid"><div class="card stat"><div class="muted">Envios</div><div class="n">${S.fulls.length}</div></div><div class="card stat"><div class="muted">Em separação</div><div class="n">${S.fulls.filter(x=>x.full.status==='em_separacao').length}</div></div><div class="card stat"><div class="muted">Prontos</div><div class="n">${S.fulls.filter(x=>x.full.status==='pronto').length}</div></div><div class="card stat"><div class="muted">Enviados</div><div class="n">${S.fulls.filter(x=>x.full.status==='enviado').length}</div></div></div><div class="grid2" style="margin-top:14px"><div class="card"><b>Próximos envios</b>${S.fulls.slice(0,6).map(x=>`<div class="shipment"><div class="row between"><div><b>${esc(x.full.nome)}</b><div class="small muted">${dateBR(x.full.previsao_data)} • ${fmt(x.stats.unidades)} un.</div></div>${badge(x.full.status)}</div></div>`).join('')||'<div class="empty">Nenhum envio.</div>'}</div><div class="card"><b>Desempenho rápido</b>${S.performance.slice(0,6).map(p=>`<div style="margin-top:13px"><div class="row between"><b>${esc(p.nome)}</b><span>${p.progresso.toFixed(0)}%</span></div><div class="progress" style="margin-top:6px"><div class="bar ${p.progresso>=100?'ok':''}" style="width:${Math.min(100,p.progresso)}%"></div></div><div class="small muted" style="margin-top:4px">${fmt(p.separado)} / ${fmt(p.atribuido)} unidades</div></div>`).join('')||'<div class="empty">Sem dados.</div>'}</div></div>`}
function adminShipmentPage(){return `<div class="top"><div><div class="title">Envios</div><div class="sub">Cadastre, distribua e acompanhe cada FULL.</div></div><button class="btn primary" onclick="openImport()">＋ Cadastrar envio</button></div>${S.fulls.map(x=>`<div class="shipment"><div class="row between"><div><b>${esc(x.full.nome)}</b><div class="small muted">Frete #${esc(x.full.frete_ml||'—')} • previsto ${dateBR(x.full.previsao_data)}</div></div>${badge(x.full.status)}</div><div class="metricline"><div class="metric"><span class="small muted">Produtos</span><b>${x.stats.produtos}</b></div><div class="metric"><span class="small muted">Unidades</span><b>${fmt(x.stats.unidades)}</b></div><div class="metric"><span class="small muted">Separadas</span><b>${fmt(x.stats.separado)}</b></div><div class="metric"><span class="small muted">Volumes</span><b>${x.stats.volumes}</b></div></div><div class="row" style="margin-top:12px"><button class="btn blue" onclick="adminOpenFull('${x.full.id}')">Abrir envio</button><button class="btn" onclick="manageShipmentUsers('${x.full.id}')">👥 Atribuir colaboradores</button><button class="btn danger-outline" onclick="deleteFull('${x.full.id}')">🗑 Excluir envio</button></div></div>`).join('')||'<div class="empty">Nenhum envio cadastrado.</div>'}`}
function adminUsersPage(){return `<div class="top"><div><div class="title">Colaboradores</div><div class="sub">Cadastre as pessoas que vão trabalhar na separação.</div></div><button class="btn primary" onclick="openUsers()">＋ Novo colaborador</button></div><div class="grid2">${S.users.map(u=>`<div class="card"><div class="row between"><b>${esc(u.nome)}</b><span class="badge ${u.tem_senha?'available':'busy'}">${u.tem_senha?'Ativo':'Sem senha'}</span></div>${u.tem_senha?'':'<div class="small err" style="margin-top:6px">Este colaborador não consegue entrar até que uma senha seja definida.</div>'}<div class="row" style="margin-top:10px"><button class="btn blue" onclick="openSetPassword('${u.id}')">🔑 ${u.tem_senha?'Redefinir senha':'Definir senha'}</button><button class="btn danger-outline" onclick="deleteUser('${u.id}')">🗑 Excluir</button></div></div>`).join('')||'<div class="empty">Nenhum colaborador cadastrado.</div>'}</div>`}
function adminPerformancePage(){return `<div class="top"><div><div class="title">Desempenho individual</div><div class="sub">A separação e os volumes são recalculados em tempo real. As divergências vêm da conferência do Mercado Livre registrada em cada envio.</div></div></div><div class="card"><div style="overflow:auto"><table><thead><tr><th>Colaborador</th><th>Envios</th><th>Produtos</th><th>Atribuído</th><th>Separado</th><th>Em caixas</th><th>Operacional</th><th>Conferidos</th><th>Divergências</th></tr></thead><tbody>${S.performance.map(p=>`<tr><td><b>${esc(p.nome)}</b></td><td>${p.envios}</td><td>${p.produtos}</td><td>${fmt(p.atribuido)}</td><td>${fmt(p.separado)}</td><td>${fmt(p.em_volumes)}</td><td style="min-width:180px"><div class="progress"><div class="bar ${p.progresso_operacional>=100?'ok':''}" style="width:${Math.min(100,p.progresso_operacional)}%"></div></div><span class="small muted">${p.progresso_operacional.toFixed(1)}% • separação ${p.progresso.toFixed(1)}% • caixas ${p.progresso_volumes.toFixed(1)}%</span></td><td>${p.produtos_conferidos?`${p.produtos_conferidos}<div class="small muted">${p.taxa_acerto}% de acerto</div>`:'<span class="small muted">—</span>'}</td><td>${p.divergencias.length?`<span class="badge" style="color:var(--stop)">${p.divergencias.length} (falta ${fmt(p.unidades_falta)} • sobra ${fmt(p.unidades_sobra)})</span>`:(p.produtos_conferidos?'<span class="badge pronto">Sem erros</span>':'<span class="small muted">—</span>')}</td></tr>${p.divergencias.length?`<tr><td colspan="9" style="background:var(--surface2)"><div class="small" style="padding:6px 2px"><b>Detalhe das divergências de ${esc(p.nome)}:</b>${p.divergencias.map(dv=>`<div style="padding:5px 0;border-bottom:1px dashed var(--line)">${esc(dv.product_nome)} <span class="muted">(${esc(dv.sku||'-')})</span> — envio <b>${esc(dv.full_nome)}</b>: esperado ${fmt(dv.esperado)}, conferido ${fmt(dv.conferido)} → <span style="color:${dv.diferenca<0?'var(--stop)':'var(--route)'}">${dv.diferenca<0?'faltaram '+fmt(Math.abs(dv.diferenca)):'sobraram '+fmt(dv.diferenca)}</span>${dv.obs?` <span class="muted">— "${esc(dv.obs)}"</span>`:''}</div>`).join('')}</div></td></tr>`:''}`).join('')}</tbody></table></div></div>`}
function adminFullPage(){if(!S.full)return '<div class="empty">Selecione um envio.</div>';let d=S.full;return `<div class="top"><div><button class="btn" onclick="adminShipments()">← Envios</button><div class="title" style="margin-top:10px">${esc(d.full.nome)}</div><div class="sub">Frete #${esc(d.full.frete_ml||'—')} • ${dateBR(d.full.previsao_data)} • ${badge(d.full.status)}</div></div></div><div class="grid"><div class="card stat"><div class="muted">Produtos</div><div class="n">${d.stats.produtos}</div></div><div class="card stat"><div class="muted">Unidades</div><div class="n">${fmt(d.stats.unidades)}</div></div><div class="card stat"><div class="muted">Separadas</div><div class="n">${fmt(d.stats.separado)}</div></div><div class="card stat"><div class="muted">Volumes</div><div class="n">${d.stats.volumes}</div></div>${d.stats.produtos_conferidos?`<div class="card stat"><div class="muted">Divergências</div><div class="n" style="color:${d.stats.produtos_divergentes?'var(--stop)':'var(--go)'}">${d.stats.produtos_divergentes}</div></div>`:''}</div><div class="tabs" style="margin-top:15px"><button class="tab ${S.tab==='shipments'?'active':''}" onclick="S.tab='shipments';render()">Produtos</button><button class="tab ${S.tab==='people'?'active':''}" onclick="S.tab='people';render()">Colaboradores</button><button class="tab ${S.tab==='volumes'?'active':''}" onclick="S.tab='volumes';render()">Volumes</button><button class="tab ${S.tab==='conferencia'?'active':''}" onclick="S.tab='conferencia';render()">Conferência${d.stats.produtos_divergentes?` <span class="badge enviado" style="color:var(--stop);margin-left:4px">${d.stats.produtos_divergentes}</span>`:''}</button></div>${S.tab==='shipments'?adminProducts(d):S.tab==='people'?adminShipmentPeople(d):S.tab==='volumes'?adminVolumes(d):adminConferencia(d)}`}
function adminProducts(d){return `<div class="card"><b>Produtos</b>${d.products.map(p=>`<div class="product"><div class="row between"><div><b>${esc(p.nome)}</b><div class="small muted">${esc(p.sku||p.codigo_ml||'-')}</div></div><div>${p.claimed_user_nome?`<span class="badge busy">${esc(p.claimed_user_nome)}</span>`:'<span class="badge available">Disponível</span>'}</div></div><div class="metricline"><div class="metric"><span class="small muted">PDF</span><b>${fmt(p.quantidade)}</b></div><div class="metric"><span class="small muted">Separado</span><b>${fmt(p.separado)}</b></div><div class="metric"><span class="small muted">Em caixas</span><b>${fmt(p.em_volumes)}</b></div><div class="metric"><span class="small muted">Saldo</span><b>${fmt(p.saldo_separar)}</b></div></div><div class="row" style="margin-top:10px"><button class="btn blue" onclick='editProduct(${JSON.stringify(p.id)})'>✏️ Editar</button><button class="btn danger-outline" onclick="deleteProduct('${p.id}')">🗑 Excluir</button></div></div>`).join('')}</div>`}
function confBadge(p){if(p.status_conferencia==null)return '<span class="badge aguardando">Não conferido</span>';if(p.status_conferencia==='ok')return '<span class="badge pronto">Confere</span>';if(p.status_conferencia==='falta')return `<span class="badge" style="color:var(--stop)">Faltou ${fmt(Math.abs(p.diferenca_conferencia))}</span>`;return `<span class="badge" style="color:var(--route)">Sobrou ${fmt(p.diferenca_conferencia)}</span>`}
function adminConferencia(d){return `<div class="notice small">Depois que o Mercado Livre conferir o envio, registre aqui a quantidade que eles contaram de cada produto. Se der diferença, o item aparece automaticamente na aba <b>Desempenho</b>, associado a quem separou aquele produto.</div><div class="card" style="margin-top:14px"><b>Conferência por produto</b>${d.products.map(p=>`<div class="product"><div class="row between"><div><b>${esc(p.nome)}</b><div class="small muted">${esc(p.sku||p.codigo_ml||'-')} • separado por ${esc(p.claimed_user_nome||'ninguém')}</div></div>${confBadge(p)}</div><div class="row" style="margin-top:12px;align-items:flex-end">
<div class="field" style="width:110px"><label>Enviado</label><div class="qty-big" style="padding:11px 0">${fmt(p.quantidade)}</div></div>
<div class="field" style="width:130px"><label>Conferido ML</label><input id="conf-${p.id}" type="number" min="0" class="qty-input" style="width:100%;font-size:18px;min-height:44px" value="${p.conferido==null?'':p.conferido}" placeholder="—"></div>
<div class="field" style="flex:1;min-width:160px"><label>Observação</label><input id="confobs-${p.id}" placeholder="opcional" value="${esc(p.conferencia_obs||'')}"></div>
<button class="btn blue" onclick="saveConferencia('${p.id}')">Salvar</button>
${p.conferido!=null?`<button class="btn danger-outline" onclick="clearConferencia('${p.id}')">Limpar</button>`:''}
</div></div>`).join('')}</div>`}
async function saveConferencia(pid){let v=$('#conf-'+pid).value,obs=$('#confobs-'+pid).value;if(v==='')return alert('Informe a quantidade que o Mercado Livre conferiu.');try{await api('/api/products/'+pid+'/conferencia',{method:'PUT',body:JSON.stringify({conferido:Number(v),obs})});S.full=await api('/api/fulls/'+S.full.full.id);render()}catch(e){alert(e.message)}}
async function clearConferencia(pid){try{await api('/api/products/'+pid+'/conferencia',{method:'PUT',body:JSON.stringify({conferido:null,obs:null})});S.full=await api('/api/fulls/'+S.full.full.id);render()}catch(e){alert(e.message)}}
function editProduct(pid){let p=S.full.products.find(x=>x.id===pid);if(!p)return;modal(`<h2>Editar produto</h2><div class="field"><label>Nome</label><input id="epNome" value="${esc(p.nome)}"></div><div class="field" style="margin-top:10px"><label>Quantidade (do PDF)</label><input id="epQtd" type="number" min="0" value="${p.quantidade}"></div><div class="small muted" style="margin-top:6px">Já separado: ${fmt(p.separado)} • Em caixas: ${fmt(p.em_volumes)}. A quantidade não pode ficar menor que isso.</div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveProductEdit('${pid}')">Salvar</button></div>`)}
async function saveProductEdit(pid){let nome=document.querySelector('#epNome').value.trim(),qtd=parseInt(document.querySelector('#epQtd').value);if(!nome){alert('Nome não pode ficar vazio.');return}if(isNaN(qtd)||qtd<0){alert('Quantidade inválida.');return}try{await api('/api/products/'+pid,{method:'PUT',body:JSON.stringify({nome:nome,quantidade:qtd})});closeM();S.full=await api('/api/fulls/'+S.full.full.id);await loadAll();render()}catch(e){alert(e.message)}}
async function deleteProduct(pid){if(!confirm('Excluir este produto do envio? Se ele já tiver separação ou unidades em caixas, esse progresso também será apagado. Essa ação não pode ser desfeita.'))return;try{await api('/api/products/'+pid,{method:'DELETE'});S.full=await api('/api/fulls/'+S.full.full.id);await loadAll();render()}catch(e){alert(e.message)}}
function adminShipmentPeople(d){return `<div class="card"><div class="row between"><div><b>Colaboradores deste envio</b><div class="small muted">Atribua o envio às pessoas. Dentro do envio, cada produto é assumido por quem clicar em "Separar" primeiro.</div></div><button class="btn primary" onclick="manageShipmentUsers('${d.full.id}')">＋ Atribuir</button></div>${d.shipment_users.map(u=>`<div class="shipment"><div class="row between"><b>${esc(u.user_nome)}</b><button class="btn danger" onclick="removeShipmentUser('${d.full.id}','${u.user_id}')">Remover</button></div></div>`).join('')||'<div class="empty">Nenhum colaborador atribuído.</div>'}</div>`}
function adminVolumes(d){return `<div class="card"><div class="row between"><div><b>Volumes</b><div class="small muted">As caixas são criadas conforme a operação acontece.</div></div><button class="btn primary" onclick="newVol()">＋ Abrir caixa</button></div><div class="grid2" style="margin-top:14px">${d.volumes.map(v=>`<div class="volume ${v.status==='fechada'?'closed':''}"><div class="row between"><div><b>Caixa ${v.seq}</b><div class="small muted">${fmt(v.total_unidades)} unidades</div></div><span class="badge ${v.status==='fechada'?'pronto':'em_separacao'}">${v.status==='fechada'?'Fechada':'Aberta'}</span></div>${v.items.map(i=>`<div class="volume-item"><span>${esc(i.product_nome)}</span><b>${fmt(i.quantidade)}</b></div>`).join('')||'<div class="small muted" style="margin-top:10px">Vazia</div>'}<div class="volume-actions"><button class="btn blue" onclick="addItem('${v.id}')">Editar conteúdo</button><button class="btn" onclick="editVol('${v.id}')">Editar quantidades</button><button class="btn danger-outline" onclick="deleteVol('${v.id}')">Excluir caixa</button>${v.status==='aberta'?`<button class="btn primary" onclick="toggleVol('${v.id}')">Fechar caixa</button>`:`<button class="btn" onclick="toggleVol('${v.id}')">Reabrir</button>`}</div></div>`).join('')||'<div class="empty">Nenhum volume ainda.</div>'}</div></div>`}
function modal(x){$('#modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeM()"><div class="modal">${x}</div></div>`}function closeM(){$('#modal').innerHTML=''}
function openImport(){modal(`<h2>Novo envio</h2><div class="notice">Importe o PDF do Mercado Livre. O sistema vai conferir produtos e quantidades antes de criar o envio.</div><div class="field" style="margin-top:14px"><label>PDF</label><input id="pdf" type="file" accept="application/pdf"></div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="readPDF()">Ler PDF</button></div>`)}
async function readPDF(){let f=$('#pdf').files[0];if(!f)return alert('Selecione o PDF.');let fd=new FormData();fd.append('file',f);let d=await api('/api/import-pdf',{method:'POST',body:fd});S.preview={...d.parsed,filename:d.filename};let p=S.preview,total=p.products.reduce((a,x)=>a+x.quantidade,0);
  if(d.existing){showImportDiff(d.existing,p,total);return}
  modal(`<h2>Conferência</h2><div class="grid"><div class="card"><div class="muted">Frete</div><b>#${esc(p.frete_ml)}</b></div><div class="card"><div class="muted">Produtos</div><b>${p.products.length} / ${p.expected_products}</b></div><div class="card"><div class="muted">Unidades</div><b>${fmt(total)} / ${fmt(p.expected_units)}</b></div><div class="card"><div class="muted">Resultado</div><b class="${total===p.expected_units?'success':'err'}">${total===p.expected_units?'OK':'Divergência'}</b></div></div><div style="max-height:42vh;overflow:auto;margin-top:12px"><table><tr><th>Produto</th><th>SKU</th><th>Qtd</th></tr>${p.products.map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.sku||'-')}</td><td>${fmt(x.quantidade)}</td></tr>`).join('')}</table></div><div class="grid2" style="margin-top:12px"><div class="field"><label>Nome do envio</label><input id="fn" value="FULL #${esc(p.frete_ml)}"></div><div class="field"><label>Data prevista</label><input id="fd" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" ${total===p.expected_units?'':'disabled'} onclick="createFull()">Criar envio</button></div>`)}
function importKey(p){let cm=(p.codigo_ml||'').trim();if(cm)return 'cm:'+cm;let sk=(p.sku||'').trim();if(sk)return 'sk:'+sk;return 'nm:'+(p.nome||'').trim().toLowerCase()}
function computeImportDiff(existing,novos){let byKey={};existing.products.forEach(p=>byKey[importKey(p)]=p);let usados=new Set(),atualizados=[],iguais=[],adicionados=[];
  novos.forEach(np=>{let k=importKey(np),ex=byKey[k];if(ex){usados.add(k);if(ex.nome!==np.nome||ex.quantidade!==np.quantidade)atualizados.push({nome:np.nome,nomeAntes:ex.nome,qtdAntes:ex.quantidade,qtdDepois:np.quantidade});else iguais.push(np)}else adicionados.push(np)});
  let naoEncontrados=existing.products.filter(p=>!usados.has(importKey(p)));
  return {atualizados,adicionados,naoEncontrados,iguais}}
function showImportDiff(existing,p,total){let diff=computeImportDiff(existing,p.products);S.importApply={full_id:existing.full.id,nome:existing.full.nome,previsao_data:existing.full.previsao_data,frete_ml:p.frete_ml,source_filename:p.filename,products:p.products};
  modal(`<h2>Este envio já existe</h2><div class="notice">Já existe um envio com o Frete #${esc(p.frete_ml)}: <b>${esc(existing.full.nome)}</b>. Em vez de criar duplicado, o sistema vai <b>atualizar</b> esse envio. Confira o que vai mudar antes de continuar.</div>
  <div style="max-height:42vh;overflow:auto;margin-top:12px">
  ${diff.atualizados.length?`<b>Quantidades/nome alterados (${diff.atualizados.length})</b><table><tr><th>Produto</th><th>Antes</th><th>Depois</th></tr>${diff.atualizados.map(x=>`<tr><td>${esc(x.nome)}</td><td>${fmt(x.qtdAntes)}</td><td>${fmt(x.qtdDepois)}</td></tr>`).join('')}</table>`:''}
  ${diff.adicionados.length?`<b style="display:block;margin-top:12px">Produtos novos (${diff.adicionados.length})</b><table><tr><th>Produto</th><th>Qtd</th></tr>${diff.adicionados.map(x=>`<tr><td>${esc(x.nome)}</td><td>${fmt(x.quantidade)}</td></tr>`).join('')}</table>`:''}
  ${diff.naoEncontrados.length?`<b style="display:block;margin-top:12px">No envio atual, mas não veio neste PDF (serão mantidos, ${diff.naoEncontrados.length})</b><table><tr><th>Produto</th></tr>${diff.naoEncontrados.map(x=>`<tr><td>${esc(x.nome)}</td></tr>`).join('')}</table>`:''}
  ${(!diff.atualizados.length&&!diff.adicionados.length&&!diff.naoEncontrados.length)?'<div class="small muted" style="margin-top:10px">Nenhuma diferença encontrada — os produtos já batem com o envio existente.</div>':''}
  </div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="applyImportUpdate()">Atualizar envio existente</button></div>`)}
async function applyImportUpdate(){let b=S.importApply;try{let d=await api('/api/fulls/'+b.full_id+'/import-update',{method:'PUT',body:JSON.stringify({nome:b.nome,previsao_data:b.previsao_data,frete_ml:b.frete_ml,source_filename:b.source_filename,products:b.products})});closeM();let r=d.relatorio;let msg=`Envio atualizado.\n${r.atualizados.length} produto(s) atualizado(s), ${r.adicionados.length} adicionado(s).`+(r.avisos.length?`\n\nAvisos:\n`+r.avisos.join('\n'):'');alert(msg);S.full=d;S.view='adminFull';S.tab='shipments';await loadAll();render()}catch(e){alert(e.message)}}
async function createFull(){let p=S.preview,d=await api('/api/fulls',{method:'POST',body:JSON.stringify({nome:$('#fn').value,previsao_data:$('#fd').value,frete_ml:p.frete_ml,source_filename:p.filename,products:p.products})});closeM();S.full=d;S.view='adminFull';S.tab='shipments';await loadAll();render()}
function openUsers(){modal(`<h2>Novo colaborador</h2><div class="field"><label>Nome</label><input id="un" placeholder="Nome do colaborador"></div><div class="field" style="margin-top:10px"><label>Senha inicial</label><input id="upass" type="password" placeholder="Mínimo 4 caracteres"></div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="addUser()">Cadastrar</button></div>`)}
async function addUser(){let nome=$('#un').value.trim(),senha=$('#upass').value;if(!nome)return alert('Informe o nome.');if(!senha||senha.length<4)return alert('A senha precisa ter pelo menos 4 caracteres.');try{await api('/api/users',{method:'POST',body:JSON.stringify({nome,senha})});closeM();await loadAll();render()}catch(e){alert(e.message)}}
function openSetPassword(uid){modal(`<h2>Definir senha</h2><div class="field"><label>Nova senha</label><input id="npass" type="password" placeholder="Mínimo 4 caracteres"></div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveSetPassword('${uid}')">Salvar</button></div>`)}
async function saveSetPassword(uid){let senha=$('#npass').value;if(!senha||senha.length<4)return alert('A senha precisa ter pelo menos 4 caracteres.');try{await api('/api/users/'+uid+'/password',{method:'PUT',body:JSON.stringify({senha})});closeM();await loadAll();render()}catch(e){alert(e.message)}}
function manageShipmentUsers(fid){let d=S.full?.full?.id===fid?S.full:null;loadFullTemp(fid).then(d=>{let assigned=new Set(d.shipment_users.map(x=>x.user_id));modal(`<h2>Colaboradores do envio</h2><div class="notice">Todos os colaboradores abaixo poderão abrir este envio. O primeiro a clicar em <b>Separar</b> assume o produto.</div><div style="margin-top:12px">${S.users.map(u=>`<div class="shipment"><div class="row between"><div><b>${esc(u.nome)}</b>${assigned.has(u.id)?'<div class="small success">Atribuído</div>':''}</div>${assigned.has(u.id)?`<button class="btn danger" onclick="removeShipmentUser('${fid}','${u.id}')">Remover</button>`:`<button class="btn primary" onclick="addShipmentUser('${fid}','${u.id}')">Atribuir</button>`}</div></div>`).join('')}</div><button class="btn" style="margin-top:8px" onclick="closeM()">Fechar</button>`)})}
async function loadFullTemp(fid){return await api('/api/fulls/'+fid)}
async function addShipmentUser(fid,uid){try{await api('/api/fulls/'+fid+'/collaborators',{method:'POST',body:JSON.stringify({user_id:uid})});closeM();await loadAll();if(S.full?.full.id===fid)S.full=await api('/api/fulls/'+fid);render()}catch(e){alert(e.message)}}
async function removeShipmentUser(fid,uid){if(!confirm('Remover este colaborador do envio?'))return;try{await api('/api/fulls/'+fid+'/collaborators/'+uid,{method:'DELETE'});closeM();await loadAll();if(S.full?.full.id===fid)S.full=await api('/api/fulls/'+fid);render()}catch(e){alert(e.message)}}
async function deleteFull(fid){if(!confirm('Excluir este envio? Todos os produtos, separações e caixas registrados nele serão apagados. Essa ação não pode ser desfeita.'))return;try{await api('/api/fulls/'+fid,{method:'DELETE'});await loadAll();render()}catch(e){alert(e.message)}}
async function deleteUser(uid){if(!confirm('Excluir este colaborador? Ele deixará de aparecer para novas atribuições, mas o histórico de separações já feitas por ele é mantido.'))return;try{await api('/api/users/'+uid,{method:'DELETE'});await loadAll();render()}catch(e){alert(e.message)}}
async function adminOpenFull(id){S.full=await api('/api/fulls/'+id);S.view='adminFull';S.tab='shipments';render()}
async function adminHome(){S.mode='admin';S.view='admin';await loadAll();render()}async function adminShipments(){S.mode='admin';S.view='adminShip';await loadAll();render()}async function adminUsers(){S.mode='admin';S.view='adminUsers';await loadAll();render()}async function adminPerf(){S.mode='admin';S.view='adminPerf';await loadAll();render()}
async function loadAll(){S.fulls=await api('/api/fulls');S.users=await api('/api/users');S.performance=await api('/api/performance')}
function logoutMe(){S.me='';S.workerToken='';localStorage.removeItem('full_me');localStorage.removeItem('full_worker_token');S.full=null;workerRender()}
async function saveMe(){let v=$('#meSel').value,senha=$('#mePass').value;if(!v)return alert('Selecione seu nome.');if(!senha)return alert('Digite sua senha.');try{let d=await api('/api/worker/login',{method:'POST',body:JSON.stringify({user_id:v,senha})});S.me=d.user_id;S.workerToken=d.token;localStorage.setItem('full_me',d.user_id);localStorage.setItem('full_worker_token',d.token);workerRender()}catch(e){$('#meErr').textContent=e.message}}
function newVol(){if(!S.full)return;api('/api/fulls/'+S.full.full.id+'/volumes',{method:'POST',body:JSON.stringify({created_by:S.me||null})}).then(async()=>{S.full=await api('/api/fulls/'+S.full.full.id);render()}).catch(e=>alert(e.message))}
function addItem(vid){let opts=S.full.products.map(p=>{let used=S.full.volumes.reduce((t,v)=>t+v.items.filter(i=>i.product_id===p.id).reduce((s,i)=>s+i.quantidade,0),0),rem=Math.max(0,p.separado-used);return `<option value="${p.id}" data-rem="${rem}">${esc(p.nome)} — ${fmt(rem)} disponíveis</option>`}).join('');modal(`<h2>Adicionar produto à caixa</h2><div class="field"><label>Produto</label><select id="vp">${opts}</select></div><div class="field" style="margin-top:12px"><label>Quantidade que entrou nesta caixa</label><input id="vq" class="qty-input" style="width:100%" type="number" min="1"></div><div class="small muted" style="margin-top:6px">A quantidade é definida conforme a caixa vai sendo montada. Não existe capacidade fixa.</div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveItem('${vid}')">Registrar</button></div>`)}
async function saveItem(vid){try{let q=Number($('#vq').value||0);if(q<1)return alert('Informe uma quantidade.');await api('/api/volumes/'+vid+'/items',{method:'POST',body:JSON.stringify({product_id:$('#vp').value,quantidade:q,modo:'definir'})});closeM();S.full=await api('/api/fulls/'+S.full.full.id);render()}catch(e){alert(e.message)}}
async function toggleVol(id){try{await api('/api/volumes/'+id+'/status',{method:'PUT'});S.full=await api('/api/fulls/'+S.full.full.id);render()}catch(e){alert(e.message)}}
async function loadHistory(){S.hist=await api('/api/fulls/'+S.full.full.id+'/history');S.tab='history';render()}
function ws(){let p=location.protocol==='https:'?'wss':'ws',w=new WebSocket(p+'://'+location.host+'/ws');w.onopen=()=>w.send('hello');w.onmessage=async e=>{let m=JSON.parse(e.data);if(m.type==='full_updated'){if(S.full?.full.id===m.full_id)S.full=m.data;if(S.mode==='admin')await loadAll();if(S.mode==='worker'&&S.full?.full.id===m.full_id)renderWorkerProducts();render()}if(m.type==='full_created'||m.type==='users_updated')await loadAll();if(m.type==='users_updated'&&S.mode==='worker')workerRender()};w.onclose=()=>setTimeout(ws,1500)}
(async()=>{try{S.users=await api('/api/users');if(S.mode==='admin'){await adminGate()}else if(S.mode==='worker'){workerRender()}else{home()}ws()}catch(e){document.querySelector('#app').innerHTML='<div class="empty">Erro ao carregar sistema: '+esc(e.message)+'</div>'}})();
</script>
</body></html>
